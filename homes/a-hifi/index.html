<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Cedar Ridge — Community Tour</title>
<style>
  :root{
    --ink:#0b1220;
    --ink-2:#1a2536;
    --paper:#ffffff;
    --muted:#68758a;
    --line:rgba(11,18,32,.10);
    --accent:#ff3158;        /* Matterport red */
    --pin:#FF7A10;           /* Homes.com orange — POI markers */
    --pin-tint:#FFEBDB;       /* ~15% of it over white, for hover */
    --pin-deep:#E06400;       /* pressed */
    --accent-deep:#c00033;   /* deep variant, for pressed/hover */
    --radius:14px;
    --shadow-lg:0 24px 60px -18px rgba(9,16,30,.45), 0 4px 14px rgba(9,16,30,.14);
    --shadow-sm:0 6px 18px -6px rgba(9,16,30,.35);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#0a1017;font-family:var(--font);-webkit-font-smoothing:antialiased}
  canvas{display:block;position:fixed;inset:0;touch-action:none}

  /* ---------- generic ui ---------- */
  .ui{position:fixed;z-index:20}
  .pill{
    background:rgba(255,255,255,.92);backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid rgba(255,255,255,.6);border-radius:999px;
    box-shadow:var(--shadow-sm);color:var(--ink);
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ---------- top bar ---------- */
  #brandLabel{top:18px;left:18px;
    transition:opacity .4s ease,transform .4s cubic-bezier(.22,1,.36,1),visibility 0s 0s}
  /* the interior tour has its own title bar — hide the campus label there */
  #brandLabel.hide{opacity:0;visibility:hidden;transform:translateY(-8px);
    transition:opacity .35s ease,transform .35s ease,visibility 0s .35s}

  /* ---------- aerial controls: enter + orbit playback ---------- */
  /* pins are the way in, so the orbit control stands alone */
  /* transport cluster, bottom-left: prev · play/pause · next. The pins carry an
     authored order (n:1..5), so stepping through them is playback of the same
     kind the pause button already implies. */
  #aerialTransport{position:fixed;z-index:30;left:22px;bottom:22px;
    display:flex;align-items:center;gap:6px;
    transition:opacity .35s,visibility 0s 0s}
  #aerialTransport.hide{opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
  /* One pill for the three transport controls, on the same surface as the
     interior view switch: a single hairline ring around the group rather than
     three, so it reads as one control with three actions. */
  #poiPill{display:flex;align-items:center;height:38px;padding:0 3px;border-radius:999px;
    background:rgba(51,51,51,.70);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(112,112,112,.5);transition:border-color .16s ease}
  #poiPill:hover{border-color:#fff}
  .ppbtn{width:32px;height:32px;padding:0;border:none;background:none;border-radius:50%;
    display:grid;place-items:center;position:relative;
    transition:background .14s ease,transform .12s}
  .ppbtn:hover{background:rgba(255,255,255,.15)}
  .ppbtn:active{transform:scale(.93)}
  .ppbtn svg{width:18px;height:18px;display:block}
  .ppbtn .chev{fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
  #playBtn .ico-play,#playBtn .ico-pause rect{fill:#fff}
  /* running the tour is a mode, not just a glyph swap, so the button inverts
     and holds — matching how the orbit button reports its own state */
  .ppbtn.on{background:#fff}
  .ppbtn.on:hover{background:#f2f2f2}
  #playBtn.on .ico-play,#playBtn.on .ico-pause rect{fill:#333}

  /* orbit and reset are view controls, not transport, so they sit a beat apart
     from the pill */
  #orbitBtn{margin-left:7px}
  .iconbtn .gly{fill:none;stroke:#fff;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .iconbtn .glyf{fill:#fff}
  .iconbtn.on .gly{stroke:#333}
  .iconbtn.on .glyf{fill:#333}

  /* same dark surface as the interior toolbar, sized up as the primary action */
  /* Aerial controls use the showcase idiom: the same 38px surface, drawn in SVG
     with a stroked hairline rather than a CSS border, and the same hover. */

  /* transport glyphs are solid shapes, not outlines */
  #playBtn .ico-play{display:none}
  #playBtn.paused .ico-pause{display:none}
  #playBtn.paused .ico-play{display:block}
  /* the aerial view carries the Matterport lockup on its own, no pill.
     A drop shadow keeps the white artwork readable against the bright sky. */
  #brandLabel .logo{height:27px;width:auto;display:block;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.5)) drop-shadow(0 0 2px rgba(0,0,0,.3))}

  /* ---------- hint ---------- */
  #hint{bottom:20px;left:50%;transform:translateX(-50%);padding:8px 16px;font-size:11.5px;color:var(--muted);
    font-weight:550;letter-spacing:.01em;transition:opacity .5s;pointer-events:none}

  /* ---------- POI pins ---------- */
  /* A labelled chip until the pin is chosen; then just the dot, so the card
     beside it is not covering its own title. */
  #poiLayer{position:fixed;inset:0;z-index:15;pointer-events:none}
  /* The marker is anchored by its tip, not its centre: the SVG point sits at
     73.48 of 76, so the element is pulled up a whisker past 100% to land the
     tip exactly on the projected ground position the leader line also targets. */
  .poi{position:absolute;transform:translate(-50%,calc(-100% + 1.3px));
       pointer-events:auto;cursor:pointer;width:26px;height:40px;
       transition:opacity .28s ease;will-change:left,top}

  /* Brand at rest, so the markers carry the palette the whole time.
     Hover deepens it, and the chosen pin inverts to white with a brand
     outline — the largest change, reserved for the largest state. */
  .poi .arrow{position:relative;z-index:2;display:block;width:26px;height:40px;
    filter:drop-shadow(0 3px 6px rgba(9,16,30,.45));
    transform-origin:50% 96%;   /* scale about the tip, so the point never drifts */
    transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
  /* a white keyline rather than the asset's #EAEAEA: against grass, asphalt
     and roof tile the brand fill needs the harder edge to stay legible */
  .poi .arrow .shape{fill:var(--pin);stroke:#fff;stroke-width:3;
    transition:fill .18s ease,stroke .18s ease}

  .poi:hover .arrow{transform:translateY(-2px) scale(1.06)}
  .poi:hover .arrow .shape{fill:var(--pin-deep)}

  /* Chosen stays brand-filled — size, a heavier keyline and the halo carry the
     state instead of a colour flip, so the selected pin reads as "more of the
     same thing" rather than a different kind of marker. Declared after the
     hover rules at equal specificity, so it holds while hovered too. */
  .poi.active .arrow{transform:scale(1.3);
    filter:drop-shadow(0 5px 10px rgba(9,16,30,.5))}
  .poi.active .arrow .shape{fill:var(--pin);stroke:#fff;stroke-width:3.6}

  /* Ring on the ground at the tip, so the chosen pin still reads once its
     label has stepped aside for the card. */
  .poi .halo{position:absolute;z-index:0;left:50%;bottom:0;width:26px;height:26px;
    margin:0 0 -13px -13px;border-radius:50%;
    border:2px solid var(--pin);opacity:0;transform:scale(.6);
    transition:opacity .22s,transform .3s cubic-bezier(.34,1.56,.64,1)}
  .poi.active .halo{opacity:.9;transform:scale(1.3)}

  /* The label is on demand: markers alone until you point at one, so a dense
     cluster reads as pins rather than a wall of chips. It stays down for the
     selected pin too, where the open card already names the place. */
  .poi .chip{position:absolute;bottom:calc(100% + 8px);left:50%;
    display:flex;align-items:center;gap:8px;padding:6px 12px 6px 7px;border-radius:999px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow-sm);white-space:nowrap;
    transform:translateX(-50%) scale(.94);transform-origin:50% 130%;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .16s ease,transform .18s cubic-bezier(.34,1.56,.64,1),visibility 0s .16s}
  .poi:hover .chip{opacity:1;visibility:visible;transform:translateX(-50%) scale(1);
    transition:opacity .16s ease,transform .18s cubic-bezier(.34,1.56,.64,1),visibility 0s 0s}
  .poi .num{width:19px;height:19px;border-radius:50%;background:var(--pin);color:#fff;
    font-size:10.5px;font-weight:700;display:grid;place-items:center;letter-spacing:-.02em;flex:none}
  .poi .lbl{font-size:12px;font-weight:650;color:var(--ink);letter-spacing:-.01em}
  /* hovering the selected pin must not bring its label back over the card */
  .poi.active:hover .chip{opacity:0;visibility:hidden;
    transform:translateX(-50%) scale(.94);transition:opacity .14s ease,visibility 0s .14s}

  /* ---- secondary points of interest ----
     Places worth marking that have no tour behind them. Same marker family so
     they read as one system, but smaller and neutral: the brand fill is
     reserved for pins that actually open something. */
  .poi.secondary .arrow{width:21px;height:32px}
  .poi.secondary .arrow .shape{fill:#fff;stroke:#8c98a8}
  .poi.secondary:hover .arrow .shape{fill:#e8ecf1;stroke:#5b6675}
  .poi.secondary.active .arrow{transform:scale(1.18)}
  .poi.secondary.active .arrow .shape{fill:var(--ink);stroke:#fff;stroke-width:3.2}
  .poi.secondary .halo{border-color:var(--ink)}
  .poi.secondary .num{background:var(--ink)}
  /* the leader takes the same neutral when a secondary pin is the open one */
  #leaderLayer.secondary line{stroke:var(--ink)}

  .poi.occluded{opacity:.22}
  .poi.hidden{opacity:0;pointer-events:none}

  /* leader line from the active dot to the card beside it */
  /* just under #poiLayer, so the dot covers where the line lands */
  #leaderLayer{position:fixed;inset:0;z-index:14;pointer-events:none;
    opacity:0;transition:opacity .22s ease}
  #leaderLayer.on{opacity:1}
  #leaderLayer line{stroke:var(--pin);stroke-width:1.5;stroke-linecap:round}

  /* ---------- info card ---------- */
  #card{
    position:fixed;z-index:40;left:22px;top:22px;width:330px;
    background:var(--paper);border-radius:18px;box-shadow:var(--shadow-lg);
    overflow:hidden;opacity:0;transform:translateX(-14px) scale(.97);pointer-events:none;
    transition:opacity .3s ease,transform .34s cubic-bezier(.22,1,.36,1);
  }
  #card.show{opacity:1;transform:none;pointer-events:auto}
  /* sitting to the left of its pin, so it should arrive from the right */
  #card.flipped{transform:translateX(14px) scale(.97)}
  #card.flipped.show{transform:none}
  #cardArt{height:240px;position:relative;overflow:hidden;background:#0e1622}
  /* accent wash shown until the interior render is ready */
  #cardArt .ph{position:absolute;inset:0;transition:opacity .45s ease}
  #cardArt .ph::after{content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,rgba(255,255,255,.16) 0 22%,transparent 22% 100%)}
  #cardImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;transform:scale(1.06);transition:opacity .5s ease,transform 1.1s cubic-bezier(.22,1,.36,1)}
  #cardArt.ready #cardImg{opacity:1;transform:scale(1)}
  #cardArt.ready .ph{opacity:0}
  #cardClose{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;
    background:rgba(0,0,0,.28);display:grid;place-items:center;backdrop-filter:blur(6px)}
  #cardClose svg{width:13px;height:13px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round}
  #cardClose:hover{background:rgba(0,0,0,.45)}
  /* position lives with the content, the mechanism lives with the transport */
  /* The count doubles as a pager. Chevrons inherit the chip's colour, so the
     light text-only variant needs no extra rules; the label keeps a fixed width
     so the chip doesn't resize as the number changes. */
  #cardCount{position:absolute;top:10px;left:10px;height:28px;padding:0 3px;border-radius:999px;
    background:rgba(0,0,0,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;gap:1px;
    font-size:11px;font-weight:650;letter-spacing:.01em;color:#fff}
  #cardCountLabel{padding:0 2px;min-width:42px;text-align:center}
  .cnav{width:20px;height:20px;padding:0;border:none;background:none;border-radius:50%;
    display:grid;place-items:center;color:inherit;opacity:.72;
    transition:opacity .14s ease,background .14s ease}
  .cnav svg{width:13px;height:13px;stroke:currentColor;stroke-width:2.4;fill:none;
    stroke-linecap:round;stroke-linejoin:round}
  .cnav:hover{opacity:1;background:rgba(255,255,255,.18)}
  #card.textonly .cnav:hover{background:rgba(15,23,38,.10)}

  /* ---- text-only card ----
     A secondary point has no tour, so there is no interior still to show and
     the art box would just be an empty well. Collapse it and let the copy
     start at the top; the two overlay controls restyle for light ground. */
  #card.textonly #cardArt{display:none}
  #card.textonly #cardBody{padding-top:46px}
  #card.textonly #cardDesc{border-bottom:none;padding-bottom:0}
  #card.textonly #cardClose{background:rgba(15,23,38,.07)}
  #card.textonly #cardClose:hover{background:rgba(15,23,38,.15)}
  #card.textonly #cardClose svg{stroke:var(--ink)}
  #card.textonly #cardCount{background:rgba(15,23,38,.06);color:var(--muted)}

  #cardBody{padding:16px 18px 18px}
  #cardTitle{font-size:19px;font-weight:700;letter-spacing:-.025em;color:var(--ink);line-height:1.2}
  #cardSub{font-size:12.5px;color:var(--muted);font-weight:550;margin-top:3px;letter-spacing:-.005em}
  #cardDesc{font-size:12.5px;line-height:1.55;color:#3c4a5e;margin-top:10px;
    padding-bottom:2px;border-bottom:1px solid var(--line)}
  /* Same surface as the interior toolbar and the Outside pill: 38px, fully
     rounded, hairline ring, 12.5/650 label with a chevron. Opaque rather than
     70% translucent, because this one sits on solid white paper instead of the
     3D scene, where the translucency would wash out to mid grey. */
  #launch{
    margin-top:16px;width:100%;height:38px;border-radius:999px;
    background:rgba(51,51,51,.94);border:1px solid rgba(112,112,112,.5);color:#fff;
    display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:12.5px;font-weight:650;letter-spacing:-.01em;
    transition:background .16s,transform .12s;
  }
  #launch:hover{background:rgba(74,74,76,.97)}
  #launch:active{transform:scale(.97)}
  #launch svg{width:19px;height:19px;stroke:#fff;stroke-width:1.7;fill:none;
    stroke-linecap:round;stroke-linejoin:round}

  /* settings: top-right, mirroring the brand lockup opposite it. Persists
     across both modes — it isn't scene chrome, so it doesn't hide on the way
     into a tour. 38px to match every other tool. */
  #settingsBtn{position:fixed;z-index:30;top:18px;right:18px;
    transition:opacity .35s,visibility 0s 0s}
  #settingsBtn.hide{opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}

  /* ---------- interior HUD ---------- */
  /* visibility (not just opacity) so hidden interior controls can't be clicked from the aerial view */
  #interiorUI{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;visibility:hidden;
    transition:opacity .5s,visibility 0s .5s}
  #interiorUI.show{opacity:1;visibility:visible;transition:opacity .5s,visibility 0s 0s}
  /* full-width scrim across the top, fading out vertically — sits behind every
     piece of top chrome, not just the logo block */
  #topScrim{position:absolute;top:0;left:0;right:0;height:184px;pointer-events:none;
    background:linear-gradient(to bottom,
      rgba(9,15,25,.72) 0%,
      rgba(9,15,25,.52) 26%,
      rgba(9,15,25,.28) 55%,
      rgba(9,15,25,.09) 80%,
      rgba(9,15,25,0)   100%)}

  /* the same treatment rising from the bottom, sitting the toolbar and the
     overflow button on a readable base */
  #bottomScrim{position:absolute;bottom:0;left:0;right:0;height:168px;pointer-events:none;
    background:linear-gradient(to top,
      rgba(9,15,25,.66) 0%,
      rgba(9,15,25,.46) 28%,
      rgba(9,15,25,.24) 56%,
      rgba(9,15,25,.08) 80%,
      rgba(9,15,25,0)   100%)}

  /* branded overlay block, drawn straight onto the scene rather than in a pill */
  #intTop{position:absolute;top:0;left:0;padding:20px 22px 24px 22px;pointer-events:none;color:#fff}
  #intTop .brand{display:flex;align-items:center}
  /* official lockup: mark + wordmark in one artwork, sized by height */
  #intTop .logo{height:29px;width:auto;display:block}
  #intTop .name{margin-top:15px;font-size:12.5px;font-weight:700;letter-spacing:-.005em;line-height:1.35}
  #intTop .by{font-size:12.5px;font-weight:600;opacity:.88;letter-spacing:-.005em;line-height:1.35}





  /* ---------- showcase toolbar: supplied Figma assets ---------- */
  /* Surface values come from the assets: #333 at 70% behind a #707070 hairline. */
  .tbtn{
    background:rgba(51,51,51,.70);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(112,112,112,.5);border-radius:999px;
    color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;
    height:38px;padding:0 16px;position:relative;
    font-size:12.5px;font-weight:650;letter-spacing:-.01em;
    transition:background .16s,border-color .16s,transform .12s;
  }
  .tbtn:hover{border-color:#fff}
  .tbtn:active{transform:scale(.97)}
  .tbtn.circ{width:38px;padding:0}
  .tbtn svg{width:19px;height:19px;stroke:#fff;stroke-width:1.7;fill:none;
    stroke-linecap:round;stroke-linejoin:round}

  #tools{position:absolute;bottom:22px;left:22px;pointer-events:auto;
    display:flex;align-items:center;gap:8px}


  /* --- circular tools: the asset draws its own surface --- */
  .iconbtn{position:relative;width:38px;height:38px;padding:0;border:none;background:none;
    transition:transform .12s}
  .iconbtn:active{transform:scale(.96)}
  .iconbtn > svg{width:38px;height:38px;display:block;overflow:hidden}
  /* the Outside pill is the same surface, just a wider asset */
  .iconbtn.wide{width:95px}
  .iconbtn.wide > svg{width:95px;height:38px}
  .iconbtn .btn-bg{fill:rgba(51,51,51,.70)}
  .iconbtn .btn-ring{fill:none;stroke:rgba(112,112,112,.5);stroke-width:1;
    transition:stroke .16s ease}
  .iconbtn .btn-fg{fill:#fff}
  /* hover is the outline going white, across every tool on the showcase —
     the surface itself holds still so the scene behind it doesn't shift */
  .iconbtn:hover .btn-ring{stroke:#fff}
  /* armed / active inverts, matching the supplied white variant */
  .iconbtn.on .btn-bg{fill:#fff}
  .iconbtn.on .btn-fg{fill:#333}
  .iconbtn.on:hover .btn-bg{fill:#f2f2f2}

  /* --- 3-way view switch --- */
  #viewSwitch{position:relative;width:110px;height:38px;flex:none}
  #viewSwitch > svg{width:110px;height:38px;display:block;overflow:hidden}
  #viewSwitch .sw-pill{fill:rgba(51,51,51,.70)}
  #viewSwitch .sw-pill-ring,
  #viewSwitch .knob-ring{fill:none;stroke:rgba(112,112,112,.5);stroke-width:1;
    transition:stroke .16s ease}
  #viewSwitch:hover .sw-pill-ring{stroke:#fff}
  #viewSwitch .knob-bg{fill:#fff}
  #viewSwitch .g{fill:#fff;transition:fill .2s}
  /* the knob slides between the three slot centres: 19, 55, 91 */
  #viewSwitch .sw-knob{transition:transform .3s cubic-bezier(.22,1,.36,1)}
  #viewSwitch[data-view="dollhouse"] .sw-knob{transform:translateX(0)}
  #viewSwitch[data-view="floorplan"] .sw-knob{transform:translateX(36px)}
  #viewSwitch[data-view="walk"]      .sw-knob{transform:translateX(72px)}
  #viewSwitch[data-view="dollhouse"] .g-dollhouse,
  #viewSwitch[data-view="floorplan"] .g-floorplan,
  #viewSwitch[data-view="walk"]      .g-walk{fill:#333}
  /* transparent hit areas over each slot */
  #viewSwitch .sw-hit{position:absolute;top:0;height:38px;width:36px;border:none;background:none;padding:0}
  #viewSwitch .sw-hit:nth-of-type(1){left:0}
  #viewSwitch .sw-hit:nth-of-type(2){left:37px}
  #viewSwitch .sw-hit:nth-of-type(3){left:73px}

  .tbtn .tip,.iconbtn .tip,.sw-hit .tip,.rtbtn .tip{position:absolute;bottom:calc(100% + 9px);left:50%;
    transform:translateX(-50%) translateY(4px);
    background:rgba(20,20,22,.94);color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.01em;
    padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s}
  .tbtn:hover .tip,.iconbtn:hover .tip,.sw-hit:hover .tip,.rtbtn:hover .tip{opacity:1;transform:translateX(-50%)}

  /* ---------- right-hand cluster: share · overflow · AI ---------- */
  #rightTools{position:absolute;bottom:22px;right:22px;pointer-events:auto;
    display:flex;align-items:center;gap:4px}
  .rtbtn{padding:0;border:none;background:none;position:relative;transition:transform .12s}
  .rtbtn:active{transform:scale(.96)}
  .rtbtn > svg{display:block;overflow:hidden}   /* these viewBoxes crop a shared artwork */
  /* share + overflow share the same surface treatment as the left toolbar */
  .rtbtn.dark{width:38px;height:38px}
  .rtbtn.dark > svg{width:38px;height:38px}
  .rtbtn.dark .btn-bg{fill:rgba(51,51,51,.70)}
  .rtbtn.dark .btn-ring{fill:none;stroke:rgba(112,112,112,.5);stroke-width:1;
    transition:stroke .16s ease}
  .rtbtn.dark .btn-fg{fill:#fff}
  .rtbtn.dark:hover .btn-ring{stroke:#fff}
  /* the AI button is a white pill with a gradient ring — its own thing */
  .rtbtn.ai{width:42px;height:42px}
  /* inset by 1px so the white sits exactly under the 40px gradient ring
     rather than peeking outside it */
  .rtbtn.ai::before{content:"";position:absolute;inset:1px;border-radius:50%;background:#fff}
  .rtbtn.ai > svg{position:relative;width:42px;height:42px}
  .rtbtn.ai:hover{filter:brightness(1.04) saturate(1.08)}

  #moreMenu,#moreMenuAerial{position:absolute;bottom:74px;right:22px;width:224px;padding:6px;pointer-events:auto;
    background:rgba(32,32,34,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.10);border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.45);
    opacity:0;visibility:hidden;transform:translateY(6px) scale(.97);transform-origin:100% 100%;
    transition:opacity .2s,transform .24s cubic-bezier(.22,1,.36,1),visibility 0s .24s}
  #moreMenu.open,#moreMenuAerial.open{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .24s cubic-bezier(.22,1,.36,1),visibility 0s 0s}
  #moreMenu button,#moreMenuAerial button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:9px;
    font-size:12.5px;font-weight:600;color:#fff;letter-spacing:-.01em;text-align:left;transition:background .15s}
  #moreMenu button:hover,#moreMenuAerial button:hover{background:rgba(255,255,255,.10)}
  #moreMenu svg,#moreMenuAerial svg{width:15px;height:15px;stroke:rgba(255,255,255,.62);stroke-width:1.9;fill:none;
    stroke-linecap:round;stroke-linejoin:round;flex:none}
  #moreMenu .sep,#moreMenuAerial .sep{height:1px;background:rgba(255,255,255,.12);margin:5px 8px}
  /* the aerial copy is fixed rather than absolute — it lives outside #interiorUI */
  #moreMenuAerial{position:fixed;z-index:31;bottom:74px;right:22px}

  /* measurement overlay */
  #measureLayer{position:absolute;inset:0;pointer-events:none}
  .mlabel{position:absolute;transform:translate(-50%,-50%);background:var(--ink);color:#fff;
    font-size:11.5px;font-weight:650;letter-spacing:-.01em;padding:5px 9px;border-radius:8px;
    white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .mlabel span{opacity:.6;font-weight:550;margin-left:5px}
  #measureHint{position:absolute;top:26px;left:50%;transform:translateX(-50%);background:rgba(11,18,32,.86);color:#fff;
    font-size:11.5px;font-weight:600;padding:8px 13px;border-radius:9px;pointer-events:none;
    opacity:0;transition:opacity .3s;letter-spacing:.005em}
  #measureHint.show{opacity:1}

  /* walk-mode chrome */
  #reticle{position:absolute;width:0;height:0;pointer-events:none}
  #walkHint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.01em;pointer-events:none;
    text-shadow:0 1px 10px rgba(0,0,0,.6);opacity:0;transition:opacity .45s}
  #walkHint.show{opacity:.9}
  #roomName{position:absolute;left:50%;top:26px;transform:translateX(-50%);color:#fff;
    font-size:12.5px;font-weight:650;letter-spacing:.02em;text-transform:uppercase;
    text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .5s}
  #roomName.show{opacity:.92}

  /* ---------- zoom ---------- */
  /* aerial: bottom-right, the conventional corner and free on this view */
  /* aerial right-hand cluster: carries the same Ask AI affordance as the tour,
     so the entry point is present before you step inside */
  #aerialRight{position:fixed;z-index:30;right:22px;bottom:22px;
    display:flex;align-items:center;gap:4px;
    transition:opacity .35s,visibility 0s 0s}
  #aerialRight.hide{opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}

  @media (max-width:720px){
    #tools{bottom:16px;left:14px;gap:6px}
    .tbtn{height:38px;padding:0 13px;font-size:12px}
    .tbtn.circ{width:38px}
    .tbtn svg{width:17px;height:17px}
    .tbtn .tip{display:none}
    #moreBtn{width:38px;height:38px}
    #intTop{padding:14px 16px 18px 16px}
    #topScrim{height:148px}
    #bottomScrim{height:132px}
    #intTop .logo{height:24px}
    #rightTools{bottom:16px;right:14px}
    #aerialRight{right:14px;bottom:16px}
    #aerialTransport{left:14px;bottom:16px;gap:5px}
    #moreMenu{bottom:64px;right:14px}
    #moreMenuAerial{bottom:64px;right:14px}
  }

  /* ---------- transition veil ---------- */
  #veil{position:fixed;inset:0;z-index:60;background:#0a1017;opacity:0;pointer-events:none;transition:opacity .001s}
  #vignette{position:fixed;inset:0;z-index:10;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(6,12,22,.42) 100%)}

  /* ---------- loading screen ---------- */
  /* Dims the live scene rather than covering it, so the space still shows
     through behind the branding. */
  #loader{position:fixed;inset:0;z-index:80;
    color:#fff;font-family:var(--font);text-align:center;
    background:rgba(0,0,0,.42);
    transition:opacity .7s ease}
  #loader.gone{opacity:0;pointer-events:none}

  /* the aerial label, hint and controls fade in only once loading finishes */
  body.loading #settingsBtn,
  body.loading #brandLabel,
  body.loading #aerialTransport,
  body.loading #aerialRight,
  body.loading #poiLayer,
  body.loading #hint{opacity:0;visibility:hidden;pointer-events:none}

  #loader .ldTitle{position:absolute;top:18%;left:50%;transform:translateX(-50%);
    font-size:clamp(21px,3.4vw,34px);font-weight:400;letter-spacing:-.005em;line-height:1.2;
    white-space:nowrap;text-shadow:0 2px 18px rgba(0,0,0,.45)}

  #loader .ldRing{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:96px;height:96px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}
  /* rotating the whole svg is invisible on the full-circle track, so only the
     dashed segment reads as movement */
  #loader .ldRing svg{width:100%;height:100%;animation:ldspin 1.25s linear infinite}
  #loader .ldLabel{position:absolute;inset:0;display:grid;place-items:center;
    font-size:8.5px;font-weight:700;letter-spacing:.19em;text-transform:uppercase}
  @keyframes ldspin{to{transform:rotate(360deg)}}

  #loader .ldKicker{font-size:9.5px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;
    opacity:.9;text-shadow:0 1px 10px rgba(0,0,0,.45)}
  #loader .ldCredit{position:absolute;top:62%;left:50%;transform:translateX(-50%)}
  #loader .ldCredit .ldBrand{margin-top:10px;font-size:clamp(19px,2.9vw,29px);font-weight:400;
    letter-spacing:-.005em;text-shadow:0 2px 16px rgba(0,0,0,.45)}

  #loader .ldPowered{position:absolute;bottom:7.5%;left:50%;transform:translateX(-50%)}
  #loader .ldLogo{height:26px;width:auto;display:block;margin:11px auto 0;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}

  @media (max-width:520px){
    #loader .ldTitle{top:14%;font-size:19px}
    #loader .ldRing{width:80px;height:80px}
    #loader .ldLogo{height:21px}
  }

  @media (max-width:640px){
    #card{right:12px;left:12px;top:auto;bottom:12px;width:auto}
    #hint{display:none}
    #brandLabel .logo{height:22px}
    #stops{max-width:52vw;overflow-x:auto}
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================================
   COSTAR GROUP OFFICE — simplified building tour prototype
   Custom camera rig (orbit + interior dolly), POI system, dual-scene tours.
   ========================================================================== */
(function(){
'use strict';

const IDLE_RESUME_MS = 5000;    // dollhouse only — the aerial orbit has a button

/* ---------------------------------------------------------------- renderer */
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance',
  logarithmicDepthBuffer:true});   // six near-coplanar ground layers need the precision
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const AERIAL_FOV   = 46;                  // tight lens flatters the campus massing
const INTERIOR_FOV = 60;                  // wide lens takes in a whole room
const camera = new THREE.PerspectiveCamera(AERIAL_FOV, innerWidth/innerHeight, 4, 2400);
/* Depth range is the other half of the z-fighting fix. Aerial wants a far
   near-plane; walking a room wants a close one. Swapping them per mode gives
   both a far tighter ratio than one compromise range ever could. */
const CLIP = { aerial:[4, 2400], interior:[0.3, 400] };
function setClip(mode){
  const [n,f] = CLIP[mode] || CLIP.aerial;
  if(camera.near === n && camera.far === f) return;
  camera.near = n; camera.far = f; camera.updateProjectionMatrix();
}

/* ------------------------------------------------------------------ scenes */
const exterior = new THREE.Scene();
exterior.fog = null;   // distance falloff lives in the basemap tiles instead

const interior = new THREE.Scene();
interior.fog = new THREE.Fog(0xdfe7f0, 60, 220);

let activeScene = exterior;

/* --------------------------------------------------------------- materials */
const M = {
  glass:      new THREE.MeshStandardMaterial({color:0x8fb4d8, metalness:.85, roughness:.14}),
  glassDark:  new THREE.MeshStandardMaterial({color:0x4d6f92, metalness:.9,  roughness:.2}),
  spandrel:   new THREE.MeshStandardMaterial({color:0xf2f4f7, metalness:.1,  roughness:.62}),
  stone:      new THREE.MeshStandardMaterial({color:0xdcd8d0, metalness:0,   roughness:.85}),
  stoneDark:  new THREE.MeshStandardMaterial({color:0xb8b3aa, metalness:0,   roughness:.9}),
  concrete:   new THREE.MeshStandardMaterial({color:0xc3c6c9, metalness:0,   roughness:.95}),
  asphalt:    new THREE.MeshStandardMaterial({color:0x50555c, metalness:0,   roughness:1}),
  grass:      new THREE.MeshStandardMaterial({color:0x7fa25c, metalness:0,   roughness:1}),
  grassDark:  new THREE.MeshStandardMaterial({color:0x6b8d4c, metalness:0,   roughness:1}),
  paver:      new THREE.MeshStandardMaterial({color:0xd7cfc2, metalness:0,   roughness:.9}),
  water:      new THREE.MeshStandardMaterial({color:0x2f6f9e, metalness:.6,  roughness:.12}),
  trunk:      new THREE.MeshStandardMaterial({color:0x6b5545, metalness:0,   roughness:1}),
  leaf:       new THREE.MeshStandardMaterial({color:0x4f7f42, metalness:0,   roughness:.95, flatShading:true}),
  leafLight:  new THREE.MeshStandardMaterial({color:0x679a4e, metalness:0,   roughness:.95, flatShading:true}),
  metal:      new THREE.MeshStandardMaterial({color:0x9aa3ad, metalness:.8,  roughness:.35}),
  accent:     new THREE.MeshStandardMaterial({color:0x2f7df6, metalness:.2,  roughness:.5}),
  white:      new THREE.MeshStandardMaterial({color:0xffffff, metalness:0,   roughness:.55}),
  // road markings only: they take a polygonOffset the 3D white trim must not
  stripe:     new THREE.MeshStandardMaterial({color:0xf4f4f2, metalness:0,   roughness:.85}),
  trim:       new THREE.MeshStandardMaterial({color:0xf7f6f2, metalness:0,   roughness:.6}),
  frame:      new THREE.MeshStandardMaterial({color:0xe9e7e1, metalness:0,   roughness:.5}),
  gutter:     new THREE.MeshStandardMaterial({color:0xdedbd4, metalness:.25, roughness:.5}),
  brick:      new THREE.MeshStandardMaterial({color:0x9c6b58, metalness:0,   roughness:.9}),
  woodLight:  new THREE.MeshStandardMaterial({color:0xd9b98c, metalness:0,   roughness:.7}),
  woodDark:   new THREE.MeshStandardMaterial({color:0x8b6a45, metalness:0,   roughness:.75}),
  carpet:     new THREE.MeshStandardMaterial({color:0x40495a, metalness:0,   roughness:1}),
  fabric:     new THREE.MeshStandardMaterial({color:0x36506e, metalness:0,   roughness:.95}),
  fabric2:    new THREE.MeshStandardMaterial({color:0xb4623f, metalness:0,   roughness:.95}),
  terrazzo:   new THREE.MeshStandardMaterial({color:0xe9e6e0, metalness:.05, roughness:.32}),
  // dedicated dark floor stone — kept separate from the pale terrazzo used on
  // the desk tops, and it gives the white floor pucks something to read against
  floorStone: new THREE.MeshStandardMaterial({color:0x4a4741, metalness:.08, roughness:.38}),
  ceiling:    new THREE.MeshStandardMaterial({color:0xf7f7f5, metalness:0,   roughness:.9}),
  intGlass:   new THREE.MeshStandardMaterial({color:0xbcd6e8, metalness:.4, roughness:.06,
                 transparent:true, opacity:.24, side:THREE.DoubleSide}),
  emissive:   new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xfff2dc, emissiveIntensity:1.6, roughness:1}),
};

/* --------------------------------------------------------------------- sky */
function makeSky(c){
  const g = new THREE.SphereGeometry(1400, 32, 20);
  const m = new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false,
    uniforms:{ top:{value:new THREE.Color(c ? c[0] : 0x000000)},
               mid:{value:new THREE.Color(c ? c[1] : 0x05070b)},
               bot:{value:new THREE.Color(c ? c[2] : 0x0e1218)} },
    vertexShader:'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:`
      varying vec3 vP; uniform vec3 top,mid,bot;
      void main(){
        float h = normalize(vP).y;
        vec3 c = mix(bot, mid, smoothstep(-0.12, 0.28, h));
        c = mix(c, top, smoothstep(0.22, 0.95, h));
        gl_FragColor = vec4(c,1.);
      }`
  });
  return new THREE.Mesh(g,m);
}
/* No sky sphere: the capture reads as an object floating in black, the way
   a real one does in a viewer. makeSky is kept because the fidelity build
   still samples it for image-based lighting. */
exterior.background = new THREE.Color(0x000000);

/* ---------------------------------------------------- image-based lighting
   The materials were already lit, but nothing was reflected: `glass` at
   metalness .85 is physically a mirror, and it was mirroring a void, so it
   rendered as flat grey. Bake the procedural sky into a PMREM cubemap once at
   startup and hand it to both scenes as `environment`; every rough surface
   picks up sky bounce and every smooth one finally has something to show.
   Built from a throwaway scene holding a second sky sphere, because the one
   above is parented to `exterior` and PMREMGenerator wants a scene of its own. */
const envMap = (()=>{
  try{
    const pmrem = new THREE.PMREMGenerator(renderer);
    // The visible sky is black, but a black cubemap lights nothing — sample a
    // neutral daylight gradient instead, so glass and metal still have
    // something to reflect against the dark backdrop.
    const skyScene = new THREE.Scene();
    skyScene.add(makeSky([0x3f7fc4, 0xa9cbe8, 0xe8eef2]));
    const rt = pmrem.fromScene(skyScene, 0, 1, 3000);
    pmrem.dispose();
    return rt.texture;
  } catch(err){ return null; }   // no float render targets — fall back to the old flat look
})();
if(envMap){ exterior.environment = envMap; interior.environment = envMap; }


/* ------------------------------------------------------------------ lights */
function lightRig(scene, sunPos, intensity, ambient, shadowSpan){
  const hemi = new THREE.HemisphereLight(0xdcecff, 0x6d6a5e, ambient);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff2df, intensity);
  sun.position.set(sunPos.x, sunPos.y, sunPos.z);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  const s = shadowSpan;
  sun.shadow.camera.left=-s; sun.shadow.camera.right=s;
  sun.shadow.camera.top=s;   sun.shadow.camera.bottom=-s;
  sun.shadow.camera.near=1;  sun.shadow.camera.far=s*4;
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.6;
  scene.add(sun); scene.add(sun.target);
  const fill = new THREE.DirectionalLight(0xbfd6f2, .28);
  fill.position.set(-sunPos.x, sunPos.y*.6, -sunPos.z);
  scene.add(fill);
  return sun;
}
lightRig(exterior, {x:120,y:170,z:90}, 2.0, .62, 170);

/* ========================================================== COMMUNITY SITE
   Stands in for a large-area drone splat capture of a residential community:

   over a big outdoor scene, not a photographic capture. */

function box(w,h,d,mat,x,y,z,parent){

  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  (parent||site).add(m); return m;
}
function slab(w,d,mat,x,y,z,rotY,parent){

  m.rotation.x = -Math.PI/2; if(rotY) m.rotation.z = rotY;

}

const SIDING = [0xe8e2d6, 0xd8dbd6, 0xcfd6dc, 0xe4d8c8, 0xd2cec6, 0xdfe3e6];
const ROOFS  = [0x5c5a57, 0x6b5f52, 0x4f5b62, 0x726257, 0x585f5c];
const sidingMats = SIDING.map(c=> new THREE.MeshStandardMaterial({color:c, roughness:.85}));
const roofMats   = ROOFS.map(c=> new THREE.MeshStandardMaterial({color:c, roughness:.7, flatShading:true}));

/* ==================================================== PROCEDURAL TEXTURES
   Every surface here used to be a single flat colour, which is what made the
   site read as a diagram rather than a place. These maps are drawn on canvas
   at runtime — no asset files, no fetch, so the page still opens by
   double-click — and the normal maps are derived from the same canvases with a
   Sobel pass, so relief always agrees with the pattern that produced it.

   Albedo gets sRGBEncoding; normal and roughness maps are raw data and must
   not, or the lighting goes soft and wrong. */

const MAXA = renderer.capabilities.getMaxAnisotropy();

function canvasOf(w, h, draw){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  return c;
}

function texOf(canvas, rx, ry, srgb){
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.anisotropy = MAXA;
  if(srgb) t.encoding = THREE.sRGBEncoding;
  return t;
}

/* Sobel over luminance → tangent-space normals. Cheap, and it means a texture
   and its relief can never drift apart. */
function normalOf(canvas, strength, rx, ry){
  const w = canvas.width, h = canvas.height;
  const src = canvas.getContext('2d').getImageData(0,0,w,h).data;
  const lum = new Float32Array(w*h);
  for(let i=0;i<w*h;i++) lum[i] = (src[i*4]*0.299 + src[i*4+1]*0.587 + src[i*4+2]*0.114)/255;
  const out = canvasOf(w, h, (ctx)=>{
    const img = ctx.createImageData(w,h);
    const at = (x,y)=> lum[((y+h)%h)*w + ((x+w)%w)];
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const dx = (at(x+1,y-1) + 2*at(x+1,y) + at(x+1,y+1))
               - (at(x-1,y-1) + 2*at(x-1,y) + at(x-1,y+1));
      const dy = (at(x-1,y+1) + 2*at(x,y+1) + at(x+1,y+1))
               - (at(x-1,y-1) + 2*at(x,y-1) + at(x+1,y-1));
      let nx = -dx*strength, ny = -dy*strength, nz = 1;
      const l = Math.hypot(nx,ny,nz); nx/=l; ny/=l; nz/=l;
      const i = (y*w+x)*4;
      img.data[i]   = (nx*0.5+0.5)*255;
      img.data[i+1] = (ny*0.5+0.5)*255;
      img.data[i+2] = (nz*0.5+0.5)*255;
      img.data[i+3] = 255;
    }
    ctx.putImageData(img,0,0);
  });
  return texOf(out, rx, ry, false);
}

// value noise, tiling by construction so nothing seams at the repeat
function grain(ctx, w, h, n, min, max, alpha){
  for(let i=0;i<n;i++){
    const r = min + Math.random()*(max-min);
    ctx.globalAlpha = alpha * (0.35 + Math.random()*0.65);
    ctx.fillStyle = Math.random() < .5 ? '#000' : '#fff';
    const x = Math.random()*w, y = Math.random()*h;
    for(const [ox,oy] of [[0,0],[w,0],[-w,0],[0,h],[0,-h]]){
      ctx.beginPath(); ctx.arc(x+ox, y+oy, r, 0, 6.2832); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* ---- horizontal lap siding: boards with a shadow line under each course --- */
function sidingCanvas(hex){
  return canvasOf(256, 256, (ctx,w,h)=>{
    ctx.fillStyle = hex; ctx.fillRect(0,0,w,h);
    const course = 16;
    for(let y=0;y<h;y+=course){
      ctx.fillStyle = 'rgba(0,0,0,.16)';           // reveal at the board lap
      ctx.fillRect(0, y+course-2, w, 2);
      ctx.fillStyle = 'rgba(255,255,255,.05)';     // light catch just below it
      ctx.fillRect(0, y+course, w, 1);
      ctx.fillStyle = 'rgba(0,0,0,' + (0.012 + Math.random()*0.02).toFixed(3) + ')';
      ctx.fillRect(0, y, w, course-2);             // per-board tone variance
    }
    grain(ctx, w, h, 260, .4, 1.6, .05);
  });
}

/* ---- asphalt shingles: staggered courses, tabs, weathered per-tab tone ---- */
function shingleCanvas(hex){
  return canvasOf(256, 256, (ctx,w,h)=>{
    ctx.fillStyle = hex; ctx.fillRect(0,0,w,h);
    const ch = 22, tw = 34;
    for(let row=0, y=0; y<h+ch; row++, y+=ch){
      const off = (row % 2) ? tw/2 : 0;
      for(let x=-tw; x<w+tw; x+=tw){
        ctx.fillStyle = 'rgba(0,0,0,' + (0.05 + Math.random()*0.11).toFixed(3) + ')';
        ctx.fillRect(x+off, y, tw-2, ch-3);
        ctx.fillStyle = 'rgba(0,0,0,.30)';         // keyway between tabs
        ctx.fillRect(x+off+tw-2, y, 2, ch-3);
      }
      ctx.fillStyle = 'rgba(0,0,0,.34)';           // butt-edge shadow
      ctx.fillRect(0, y+ch-3, w, 3);
    }
    grain(ctx, w, h, 900, .3, 1.1, .12);           // mineral granules
  });
}

function flatCanvas(hex, n, min, max, alpha, extra){
  return canvasOf(256, 256, (ctx,w,h)=>{
    ctx.fillStyle = hex; ctx.fillRect(0,0,w,h);
    if(extra) extra(ctx,w,h);
    grain(ctx, w, h, n, min, max, alpha);
  });
}

const hex = n => '#' + n.toString(16).padStart(6,'0');

// siding + roofs, one map per palette entry
SIDING.forEach((c,i)=>{
  const cv = sidingCanvas(hex(c));
  sidingMats[i].map         = texOf(cv, 4, 3, true);
  sidingMats[i].normalMap   = normalOf(cv, 2.2, 4, 3);
  sidingMats[i].normalScale = new THREE.Vector2(.7,.7);
  sidingMats[i].envMapIntensity = .85;
  sidingMats[i].needsUpdate = true;
});
ROOFS.forEach((c,i)=>{
  const cv = shingleCanvas(hex(c));
  roofMats[i].map          = texOf(cv, 3, 3, true);
  roofMats[i].normalMap    = normalOf(cv, 3.0, 3, 3);
  roofMats[i].normalScale  = new THREE.Vector2(1,1);
  roofMats[i].flatShading  = false;   // the shingle relief now does this job better
  roofMats[i].envMapIntensity = .7;
  roofMats[i].needsUpdate  = true;
});

/* ---- ground planes carry the most screen area, so they matter most ------- */
function dress(mat, canvas, rx, ry, nStrength, envI){
  mat.map = texOf(canvas, rx, ry, true);
  mat.normalMap = normalOf(canvas, nStrength, rx, ry);
  mat.normalScale = new THREE.Vector2(.6,.6);
  if(envI != null) mat.envMapIntensity = envI;
  mat.needsUpdate = true;
}

dress(M.grass,     flatCanvas('#7fa25c', 1400, .5, 2.4, .16), 90, 90, 1.4, .8);
dress(M.grassDark, flatCanvas('#6b8d4c', 1400, .5, 2.4, .16), 140, 140, 1.4, .8);
dress(M.asphalt,   flatCanvas('#50555c', 1800, .3, 1.3, .18), 26, 26, 1.1, .55);
dress(M.concrete,  flatCanvas('#c3c6c9', 900, .4, 1.8, .07), 22, 22, .9, .8);
dress(M.stone,     flatCanvas('#dcd8d0', 700, .5, 2.0, .06), 6, 6, .9, .8);
dress(M.stoneDark, flatCanvas('#b8b3aa', 700, .5, 2.0, .06), 6, 6, .9, .8);

// pavers keep their joints, so they get a grid rather than pure noise
dress(M.paver, flatCanvas('#d7cfc2', 300, .4, 1.4, .05, (ctx,w,h)=>{
  ctx.strokeStyle = 'rgba(0,0,0,.20)'; ctx.lineWidth = 2;
  for(let i=0;i<=w;i+=32){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,h); ctx.stroke(); }
  for(let j=0;j<=h;j+=32){ ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(w,j); ctx.stroke(); }
}), 14, 14, 1.6, .8);

/* Glass and metal were the worst offenders without a cubemap — push their
   contribution up now that there is one to sample. */
[M.glass, M.glassDark].forEach(m=>{ m.envMapIntensity = 1.5; m.needsUpdate = true; });
M.metal.envMapIntensity = 1.25;
M.water.envMapIntensity = 1.6;
M.spandrel.envMapIntensity = .9;

/* The sky is now doing part of the ambient job, so pull the hemisphere light
   back to keep the overall exposure where it was. */
exterior.traverse(o=>{ if(o.isHemisphereLight) o.intensity *= 0.72; });

/* ---- one house, parameterised ------------------------------------------
   Built as assemblies rather than primitives: the mass carries corner boards,
   the openings are recessed behind proud frames and sills so the sun draws a
   reveal line, and the roof has a real edge with fascia and gutter. Only the
   large masses go into the shadow map — trim at this scale would cost more than
   it shows. */
/* ---- hip roof -----------------------------------------------------------
   Two trapezoids and two triangles meeting at a ridge, sized to the wall plan
   plus an overhang. Winding is decided per triangle against an outward
   reference vector, so the normals can't come out inverted. UVs are a planar
   projection from above: shingle courses stay continuous across the hips, and
   1 unit of plan maps to a consistent share of the texture on every face. */
function hipRoof(w, d, oh, h, mat){
  const W = w + oh*2, D = d + oh*2;
  const pos = [], uv = [];
  const V = (x,y,z)=> new THREE.Vector3(x,y,z);
  const UVS = 14;   // plan units per texture tile

  function tri(a, b, c, out){
    const n = new THREE.Vector3().subVectors(b,a).cross(new THREE.Vector3().subVectors(c,a));
    if(n.dot(out) < 0){ const t = b; b = c; c = t; }
    for(const p of [a,b,c]){ pos.push(p.x, p.y, p.z); uv.push(p.x/UVS, p.z/UVS); }
  }
  // on a square plan the ridge collapses to a point and the roof is a true
  // pyramid, so the second triangle of each long face would be degenerate
  function quad(a, b, c, dd, out){
    tri(a,b,c,out);
    if(c.distanceToSquared(dd) > 1e-6) tri(a,c,dd,out);
  }

  if(W >= D){                        // ridge runs along x
    const r = (W - D)/2;
    const ridgeA = V(-r, h, 0), ridgeB = V(r, h, 0);
    quad(V(-W/2,0, D/2), V(W/2,0, D/2), ridgeB, ridgeA, V(0,.55, 1));
    quad(V( W/2,0,-D/2), V(-W/2,0,-D/2), ridgeA, ridgeB, V(0,.55,-1));
    tri(V( W/2,0, D/2), V( W/2,0,-D/2), ridgeB, V( 1,.55,0));
    tri(V(-W/2,0,-D/2), V(-W/2,0, D/2), ridgeA, V(-1,.55,0));
  } else {                           // ridge runs along z
    const r = (D - W)/2;
    const ridgeA = V(0, h, -r), ridgeB = V(0, h, r);
    quad(V( W/2,0,-D/2), V( W/2,0, D/2), ridgeB, ridgeA, V( 1,.55,0));
    quad(V(-W/2,0, D/2), V(-W/2,0,-D/2), ridgeA, ridgeB, V(-1,.55,0));
    tri(V( W/2,0, D/2), V(-W/2,0, D/2), ridgeB, V(0,.55, 1));
    tri(V(-W/2,0,-D/2), V( W/2,0,-D/2), ridgeA, V(0,.55,-1));
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uv, 2));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

function house(cfg){
  const g = new THREE.Group();
  g.position.set(cfg.x, 0, cfg.z);
  g.rotation.y = cfg.rotY || 0;
  site.add(g);

  const w = cfg.w || 22, d = cfg.d || 17, story = cfg.story || 1;
  const wallH = story === 2 ? 12.5 : 7.4;
  const siding = sidingMats[cfg.pal % sidingMats.length];
  const roof   = roofMats[cfg.pal % roofMats.length];

  // detail helper: same as box(), minus the shadow-map cost
  const trim = (bw,bh,bd,mat,x,y,z)=>{
    const m = box(bw,bh,bd,mat,x,y,z,g); m.castShadow = false; return m;
  };

  // parcel: lawn, driveway, walk
  slab(w+26, d+34, M.grass, 0, Y.lot, 2, 0, g);
  slab(9, 30, M.paver, -w/2+3, Y.walk, d/2+16, 0, g);   // driveway to the street
  slab(3.4, 12, M.paver, 3, Y.walk+.02, d/2+7, 0, g);   // front walk

  /* ---- foundation: the house needs to sit on something -------------------- */
  trim(w+.9, 1.5, d+.9, M.concrete, 0, .75, 0);

  /* ---- main mass --------------------------------------------------------- */
  const body = box(w, wallH, d, siding, 0, wallH/2 + 1.4, 0, g);
  occluders.push(body);

  // corner boards: the cheapest way to stop a box reading as one extrusion
  for(const sx of [-1, 1]) for(const sz of [-1, 1])
    trim(.55, wallH, .55, M.trim, sx*(w/2-.1), wallH/2 + 1.4, sz*(d/2-.1));

  // storey band on the two-storey plans, where the floor line would be
  if(story === 2) trim(w+.3, .45, d+.3, M.trim, 0, 1.4 + 7.0, 0);

  /* ---- windows: recessed glass, proud frame, projecting sill -------------
     The glass used to stand 0.15 outside the wall, which is why it read as a
     sticker. Now it sits behind the plane and the frame casts onto it. */
  function opening(cx, cy, ww, wh, face){
    const z = face * (d/2);
    const inset = .30;
    trim(ww, wh, .12, M.glassDark, cx, cy, z - face*inset);        // glazing, set back
    trim(ww+.9, .34, .30, M.frame, cx, cy + wh/2 + .17, z);        // head
    trim(ww+.9, .30, .46, M.frame, cx, cy - wh/2 - .15, z + face*.06); // sill, projecting
    for(const sx of [-1, 1])
      trim(.34, wh, .30, M.frame, cx + sx*(ww/2 + .28), cy, z);    // jambs
    trim(.16, wh*.96, .16, M.frame, cx, cy, z - face*(inset-.12)); // centre muntin
  }

  const yFront = 1.4;
  for(const px of [-6.5, 9.6]) opening(px, yFront + 4.2, 3.4, 3.4, 1);
  if(story === 2) for(const px of [-6.5, 1.5, 9.6]) opening(px, yFront + 9.6, 3.2, 3.2, 1);
  // side and rear elevations, so the house isn't a facade with three blank walls
  for(const sz of [-1, 1]){
    if(sz === -1) for(const px of [-5, 5]) opening(px, yFront + 4.2, 3.0, 3.2, -1);
  }

  /* ---- front door with casing -------------------------------------------- */
  trim(3.4, 5.4, .35, M.woodDark, 3, yFront + 2.7, d/2 + .2);
  trim(4.3, .40, .52, M.trim, 3, yFront + 5.55, d/2 + .26);       // head casing
  for(const sx of [-1, 1]) trim(.42, 5.6, .5, M.trim, 3 + sx*2.05, yFront + 2.8, d/2 + .24);
  trim(4.6, .35, 1.9, M.concrete, 3, yFront - .1, d/2 + 1.3);     // stoop

  /* ---- hipped roof, with an edge ---------------------------------------- */
  const OH = 1.5;                            // eave overhang, all four sides
  const eaveY = wallH + 1.4;
  const rf = hipRoof(w, d, OH, story === 2 ? 6.0 : 5.2, roof);
  rf.position.y = eaveY + .62;               // sits on top of the fascia band
  g.add(rf);
  occluders.push(rf);

  // eave assembly: fascia band at the roof edge, soffit closing it underneath
  const fas = box(w + OH*2, .62, d + OH*2, roof, 0, eaveY + .31, 0, g);
  fas.castShadow = true;
  trim(w + OH*2 - .1, .3, d + OH*2 - .1, M.trim, 0, eaveY - .01, 0);   // soffit
  for(const sz of [-1, 1]){
    const gut = new THREE.Mesh(new THREE.CylinderGeometry(.20,.20, w + OH*2, 8), M.gutter);
    gut.rotation.z = Math.PI/2; gut.position.set(0, eaveY + .04, sz*(d/2 + OH - .1));
    g.add(gut);
  }
  // downspouts at the front corners
  for(const sx of [-1, 1]){
    const dsp = new THREE.Mesh(new THREE.CylinderGeometry(.16,.16, wallH + 1.2, 6), M.gutter);
    dsp.position.set(sx*(w/2 - .1), (wallH + 1.2)/2 + 1.0, d/2 + OH - .3); g.add(dsp);
  }

  // chimney on some plans — pure silhouette value for four boxes
  if(cfg.pal % 2 === 0){
    const ch = box(2.6, story === 2 ? 8.0 : 6.4, 2.2, M.brick,
                   -w/2 + 4.5, wallH + 1.4 + (story === 2 ? 2.2 : 1.4), -d/4, g);
    ch.castShadow = true;
    trim(3.1, .4, 2.7, M.concrete, -w/2 + 4.5,
         wallH + 1.4 + (story === 2 ? 6.4 : 4.8), -d/4);            // cap
  }

  /* ---- garage wing ------------------------------------------------------- */
  const gw = box(11, 6.6, 11, siding, -w/2-4.5, 3.3 + 1.0, d/2-4, g);
  occluders.push(gw);

/* ============================================ CAPTURE FOOTPRINT + BASEMAP
   A real capture doesn't stop on a straight line — it ends wherever the drone
   stopped flying, so the footprint is a ragged closed contour with a rim that
   degrades into whatever the basemap underneath it is. Everything beyond that
   contour is context imagery: lower resolution, flatter, and already present
   before the capture streams in. */

const CAPTURE_R = 285;                 // mean radius; site content reaches ~230
const CAP_SEGS  = 128;

// Integer frequencies keep the contour seamless where it wraps at 2PI.
function captureRadius(a){
  return CAPTURE_R * (1
    + 0.055*Math.sin(a*3  + 0.7)
    + 0.035*Math.sin(a*5  + 2.1)
    + 0.022*Math.sin(a*8  + 4.4)
    + 0.014*Math.sin(a*13 + 1.2));
}

/* Three rings: centre, an inner ring carrying the material at full strength,
   and the rim, tinted toward the basemap through vertex colours so the capture
   dissolves into its surroundings instead of ending on a cut line. UVs mimic
   the 460-unit plane this replaces, so existing texture repeats still land at
   the same density. */
function captureGeometry(){
  const pos = [], uv = [], col = [], idx = [];
  const push = (x, z, c) => {
    pos.push(x, 0, z);
    uv.push(x/460 + 0.5, z/460 + 0.5);
    col.push(c[0], c[1], c[2]);
  };
  const FULL = [1, 1, 1], RIM = [0.74, 0.77, 0.68];

  push(0, 0, FULL);                                        // 0: centre
  for(let i=0;i<CAP_SEGS;i++){                             // 1..N inner
    const a = i/CAP_SEGS * Math.PI*2, r = captureRadius(a) * 0.88;
    push(Math.cos(a)*r, Math.sin(a)*r, FULL);
  }
  for(let i=0;i<CAP_SEGS;i++){                             // N+1..2N rim
    const a = i/CAP_SEGS * Math.PI*2, r = captureRadius(a);
    push(Math.cos(a)*r, Math.sin(a)*r, RIM);
  }
  for(let i=0;i<CAP_SEGS;i++){
    const n = (i+1) % CAP_SEGS;
    idx.push(0, 1+n, 1+i);                                 // centre fan
    const ii = 1+i, inx = 1+n, oi = 1+CAP_SEGS+i, onx = 1+CAP_SEGS+n;
    idx.push(ii, onx, oi, ii, inx, onx);                   // inner -> rim band
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ---- context basemap ---------------------------------------------------
   Stand-in for tiled aerial imagery: coarse, desaturated, and drawn once into
   a handful of canvases rather than fetched. Per-tile tint and rotation break
   the repeat the way a real mosaic does — satellite tiles are flown on
   different days, so neighbours never quite match. */
const basemap = new THREE.Group();
exterior.add(basemap);

function tileCanvas(seed){
  let s = seed;
  const rnd = ()=> (s = (s*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#7d8a63'; x.fillRect(0,0,256,256);
  for(let i=0;i<26;i++){                                   // fields and tree mass
    x.fillStyle = ['#6f7d57','#879166','#94a06f','#6a7552','#8d8a6b'][(rnd()*5)|0];
    x.globalAlpha = 0.5 + rnd()*0.4;
    const w = 26 + rnd()*90, h = 26 + rnd()*90;
    x.fillRect(rnd()*256 - w/2, rnd()*256 - h/2, w, h);
  }
  x.globalAlpha = 1;
  for(let i=0;i<3;i++){                                    // arterial roads
    x.strokeStyle = 'rgba(190,188,180,.55)';
    x.lineWidth = 2 + rnd()*2.5;
    x.beginPath();
    if(rnd() < .5){ const y0 = rnd()*256; x.moveTo(0,y0); x.lineTo(256, y0 + (rnd()*60-30)); }
    else          { const x0 = rnd()*256; x.moveTo(x0,0); x.lineTo(x0 + (rnd()*60-30), 256); }
    x.stroke();
  }
  for(let i=0;i<40;i++){                                   // rooftops
    x.fillStyle = ['rgba(150,146,140,.55)','rgba(120,116,112,.5)','rgba(168,160,150,.45)'][(rnd()*3)|0];
    x.fillRect(rnd()*256, rnd()*256, 4 + rnd()*11, 4 + rnd()*11);
  }
  for(let i=0;i<2200;i++){                                 // sensor grain
    x.fillStyle = rnd() < .5 ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.05)';
    x.fillRect(rnd()*256, rnd()*256, 1.5, 1.5);
  }
  return c;
}

const TILE = 100, TILE_N = 23;                             // 2300 units of context
(function buildBasemap(){
  const texes = [0,1,2].map(i=>{
    const t = new THREE.CanvasTexture(tileCanvas(97 + i*5417));
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.encoding = THREE.sRGBEncoding;
    return t;
  });
  // one material per texture/tint pair, reused across the grid
  const tints = [0xffffff, 0xf0efe6, 0xe6e8dc, 0xf6f2e8];
  const mats = [];
  for(const t of texes) for(const c of tints){
    mats.push(new THREE.MeshStandardMaterial({
      map:t, color:c, roughness:1, metalness:0, vertexColors:true,
      // the basemap is imagery, not a lit surface — keep it flat so it reads
      // as a different order of thing to the capture sitting on top of it
      envMapIntensity:0.25
    }));
  }
  /* The context ring steps down to black rather than blending smoothly. Each
     tile takes one flat brightness from a quantised ladder, so the grid stays
     legible as it dissolves — the look of tiles dropping out a level at a time
     rather than an airbrushed vignette. A deterministic ±1 step of jitter keeps
     it from reading as perfect concentric rings, since real tile loads are
     never that even. */
  // a longer run at 16 levels rather than a short one at 8: the ladder is finer
  // and there is more ground to spread it over, so no two adjacent rings share
  // a value by accident
  const FADE0 = CAPTURE_R * 1.2, FADE1 = CAPTURE_R * 3.4;
  const FADE_STEPS = 16;
  const geo = new THREE.PlaneGeometry(TILE, TILE);
  const half = (TILE_N-1)/2;
  for(let i=0;i<TILE_N;i++) for(let j=0;j<TILE_N;j++){
    const h = (i*73856093 ^ j*19349663) >>> 0;
    const x = (i-half)*TILE, z = (j-half)*TILE;

    const t = clamp((Math.hypot(x, z) - FADE0) / (FADE1 - FADE0), 0, 1);
    const jitter = (((h >>> 9) & 7) - 3) / FADE_STEPS;        // -3..+4 steps, on-ladder
    const level = clamp(Math.round((1 - t) * FADE_STEPS) / FADE_STEPS + jitter, 0, 1);
    if(level <= 0) continue;                                  // black: never drawn

    const m = new THREE.Mesh(geo.clone(), mats[h % mats.length]);
    m.rotation.x = -Math.PI/2;
    m.rotation.z = (h >> 4 & 3) * Math.PI/2;                  // break the grid
    m.position.set(x, -0.6, z);

    /* Half-size tiles would otherwise show the imagery at double scale. Crop
       each one to a slice of its texture instead, at a per-tile offset, so
       feature size on the ground stays put and neighbours don't repeat. */
    const uv = m.geometry.attributes.uv;
    const ou = ((h >>> 11) & 255) / 255, ov = ((h >>> 19) & 255) / 255;
    for(let k=0;k<uv.count;k++)
      uv.setXY(k, uv.getX(k)*0.5 + ou, uv.getY(k)*0.5 + ov);
    uv.needsUpdate = true;

    const p = m.geometry.attributes.position;
    const col = new Float32Array(p.count * 3).fill(level);    // flat across the tile
    m.geometry.setAttribute('color', new THREE.BufferAttribute(col, 3));
    basemap.add(m);
  }
})();

/* ---- streamed reveal ---------------------------------------------------
   The basemap is there from the first frame; the capture blooms outward from
   the centre over it, the way a tiled scene resolves nearest-first. Driven by
   one growing radius rather than per-object timers, so it stays stateless. */
/* One wavefront drives everything. `u` is progress measured in footprint
   radii: at u=1 the contour is fully grown, and the wave keeps travelling to
   1.28 so the objects sitting closest to the rim finish just after it. Because
   the edge is evaluated per angle, the wave follows the ragged contour rather
   than sweeping a perfect circle across it. */
const reveal = { u: 0, running: false, done: false };
// REVEAL_SECS is the dial for pace; REVEAL_OVERRUN is how far the wave has to
// travel, set by the outermost lit tile at roughly 3x the capture radius
const REVEAL_SECS = 4.2, REVEAL_OVERRUN = 3.6;
const revealTargets = [];
/* Collected when the loader hands over, not when this block is defined —
   trees, cars and other scatter are added further down the file, and reading
   site.children too early would leave them out of the reveal and pop them in
   at full size on the first frame.

   Buildings fade rather than scale, which means opacity, which means each one
   needs materials of its own: the palettes are shared across the whole site, so
   animating them in place would fade every house at once. Clones are made for
   the duration and handed back at the end, so the run-time scene keeps the
   shared materials it started with. */
function startReveal(){
  revealTargets.length = 0;
  const box = new THREE.Box3(), sph = new THREE.Sphere();
  // the context ring rides the same wavefront, so the load keeps travelling
  // outward past the capture instead of stopping at its edge
  site.children.concat(basemap.children).forEach(o=>{
    if(o === capture) return;
    /* Bounds first, while the object is still visible. A road is 300 units
       long: keyed off its centre alone it would flick on all at once halfway
       through the sweep, which is what made the old pass feel disjointed.
       Measured near-edge to far-edge, the wave crosses it instead. */
    box.setFromObject(o); box.getBoundingSphere(sph);
    const dist = Math.hypot(sph.center.x, sph.center.z);
    const t = {
      o,
      a:    Math.atan2(sph.center.z, sph.center.x),   // where it sits on the contour
      near: Math.max(dist - sph.radius, 0),
      span: Math.max(sph.radius * 2, 34),             // floor so small props still ease
      mats: [], k: -1
    };
    o.traverse(n=>{
      if(!n.isMesh) return;
      const orig = n.material;
      const copy = Array.isArray(orig) ? orig.map(m=>m.clone()) : orig.clone();
      n.userData._origMat = orig;
      n.material = copy;
      (Array.isArray(copy) ? copy : [copy]).forEach(m=>{
        m.transparent = true; m.opacity = 0; t.mats.push(m);
      });
    });
    o.visible = false;
    revealTargets.push(t);
  });
  capture.scale.set(0.0001, 1, 0.0001);
  reveal.u = 0; reveal.running = true; reveal.done = false;
}

// give an object its shared materials back and drop the temporary clones
function settle(t){
  t.o.traverse(n=>{
    if(!n.isMesh || !n.userData._origMat) return;
    const copy = n.material;
    n.material = n.userData._origMat;
    delete n.userData._origMat;
    (Array.isArray(copy) ? copy : [copy]).forEach(m=>m.dispose());
  });
  t.mats.length = 0;
}

function applyReveal(dt){
  if(!reveal.running || reveal.done) return;
  reveal.u += dt * (REVEAL_OVERRUN / REVEAL_SECS);
  const u = Math.min(reveal.u, REVEAL_OVERRUN);
  const x = u/REVEAL_OVERRUN;
  const e = x*x*(3 - 2*x);          // eases in and out: the ground gets a beat
                                    // on its own, then objects land at an even
                                    // rate rather than all inside the first
                                    // half-second with a long tail after
  const w = e * REVEAL_OVERRUN;

  const grow = clamp(w, 0.0001, 1);
  capture.scale.set(grow, 1, grow);

  let pending = 0;
  for(const t of revealTargets){
    if(!t.mats.length) continue;                          // already settled
    const edge = w * captureRadius(t.a);                  // the contour, at its angle
    const k = clamp((edge - t.near) / t.span, 0, 1);
    if(k < 1){
      pending++;
      const o = k*k*(3 - 2*k);                            // smoothstep, no overshoot
      if(o !== t.k){ for(const m of t.mats) m.opacity = o; t.k = o; }
      t.o.visible = k > 0;
    } else {
      t.o.visible = true;
      settle(t);
    }
  }
  if(!pending && grow >= 1){
    reveal.done = true;
    revealTargets.forEach(t=>{ if(t.mats.length) settle(t); t.o.visible = true; });
    capture.scale.set(1,1,1);
  }
}

/* Solve the orbit angle + distance that puts a POI's front elevation on screen.
   theta is derived from the facade normal; distance from the frame box and the
   camera's real FOV/aspect, so narrow windows automatically pull back. */
function computeFocus(p){
  const vfov = camera.fov * Math.PI/180;
  const hfov = 2*Math.atan(Math.tan(vfov/2) * camera.aspect);
  const rV = (p.frame.h*0.5) / Math.tan(vfov*0.5);
  const rH = (p.frame.w*0.5) / Math.tan(hfov*0.5);
  return {
    target: new THREE.Vector3(p.frame.x, p.frame.y, p.frame.z),
    theta:  Math.atan2(p.front[0], p.front[1]) + (p.yaw||0),   // stand on the facade's side
    phi:    p.phi || 1.15,
    radius: clamp(Math.max(rV, rH) * 1.28, 46, 320),
  };
}

/* ============================================================== CAMERA RIG */
const rig = {
  mode:'aerial',                       // 'aerial' | 'interior' | 'transition'
  // aerial orbit state
  target:new THREE.Vector3(-8, 6, 0),
  theta:Math.PI*0.62, phi:1.02, radius:210,
  gTarget:new THREE.Vector3(-8, 6, 0), gTheta:Math.PI*0.62, gPhi:1.02, gRadius:210,
  auto:true, idle:0, userPaused:false,   // userPaused = paused by the button, not by a drag
  // interior state
  pos:new THREE.Vector3(),             // which sweep you're standing on
  yaw:0, pitch:0,                      // absolute look direction in walk mode
  view:'walk',                         // interior view mode: 'walk' | 'dollhouse' | 'floorplan'
};
const HOME = {target:new THREE.Vector3(0,4,-10), theta:Math.PI*0.62, phi:1.00, radius:280};   // drone height over the whole community

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function easeInOut(t){return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;}

/* The auto-orbit lets theta accumulate without bound, so a raw assignment can
   spin the camera many turns. Always take the equivalent angle nearest to it. */
function nearestAngle(cur, target){
  const TAU = Math.PI*2;
  let d = (target - cur) % TAU;
  if(d >  Math.PI) d -= TAU;
  if(d < -Math.PI) d += TAU;
  return cur + d;
}


function applyAerial(){
  const {target, theta, phi, radius} = rig;
  const sp = Math.sin(phi), cp = Math.cos(phi);
  camera.position.set(
    target.x + radius*sp*Math.sin(theta),
    target.y + radius*cp,
    target.z + radius*sp*Math.cos(theta)
  );
  camera.lookAt(target);
}

/* --------------------------------------------------------- input handling */
const dom = renderer.domElement;
let dragging=false, lastX=0, lastY=0, moved=0;

function nudge(){                       // any user interaction
  rig.idle = 0;
  rig.auto = false;
}

dom.addEventListener('pointerdown', e=>{
  dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY;
  dom.setPointerCapture(e.pointerId); nudge();
  // touching the scene takes the wheel: the tour pauses where it is, and play
  // picks up from the same point rather than restarting the sequence
  if(tourOn) setTour(false);
});
dom.addEventListener('pointermove', e=>{
  if(!dragging){ hoverAt(e.clientX, e.clientY); return; }
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY; moved += Math.abs(dx)+Math.abs(dy);
  nudge();
  if(rig.mode==='aerial'){
    rig.gTheta -= dx*0.0042;
    rig.gPhi    = clamp(rig.gPhi - dy*0.0032, 0.20, 1.40);
  } else if(rig.mode==='interior' && rig.view==='walk'){
    rig.yaw  -= dx*0.0034;                                   // free 360° look
    rig.pitch = clamp(rig.pitch - dy*0.0026, -1.05, 1.05);
  } else if(rig.mode==='interior'){
    // dollhouse orbits freely; floor plan spins about the vertical axis only
    rig.gTheta -= dx*0.0052;
    if(rig.view==='dollhouse') rig.gPhi = clamp(rig.gPhi - dy*0.0034, 0.16, 1.24);
  }
});
addEventListener('pointerup', ()=>{ dragging=false; });
dom.addEventListener('wheel', e=>{
  e.preventDefault();
  zoomBy(Math.sign(e.deltaY));
}, {passive:false});
// a click on empty space (not a drag) hands the view back to the auto-orbit
dom.addEventListener('click', ev=>{
  setMore(false); setMoreAerial(false);
  if(measuring && rig.mode==='interior' && moved < 6){ measureAt(ev.clientX, ev.clientY); return; }
  if(rig.mode==='interior' && moved < 6 && clickSweep(ev.clientX, ev.clientY)) return;
  if(moved < 6 && rig.mode === 'aerial'){ closeCard({resume:!rig.userPaused}); }
});

// pinch zoom (aerial)
let pinch=null;
dom.addEventListener('touchstart', e=>{ if(e.touches.length===2){
  pinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }});
dom.addEventListener('touchmove', e=>{ if(e.touches.length===2 && pinch){
  const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  nudge(); if(rig.mode==='aerial') rig.gRadius = clamp(rig.gRadius * (pinch/d), 70, 420); pinch=d; }}, {passive:true});
dom.addEventListener('touchend', ()=>{ pinch=null; });

addEventListener('keydown', e=>{
  if(e.key==='Escape' && rig.mode==='aerial'){ closeCard({resume:true}); }
  if(e.key==='Escape' && rig.mode==='interior'){
    if(moreMenu.classList.contains('open')) setMore(false);
    else if(measuring) setMeasuring(false);
    else exitInterior();
  }
  // Arrows now drive movement, so stepping the pins moves to the brackets.
  // The on-screen prev/next buttons remain the primary affordance.
  if(rig.mode==='aerial' && !moreMenuAerial.classList.contains('open')){
    if(e.key==='['){ e.preventDefault(); setTour(false); stepPOI(-1); }
    if(e.key===']'){ e.preventDefault(); setTour(false); stepPOI(1); }
  }
  if(rig.mode==='interior' && rig.view==='walk'){
    if(e.key==='ArrowUp'   || e.key==='w'){ nudge(); stepSweep(1); }
    if(e.key==='ArrowDown' || e.key==='s'){ nudge(); stepSweep(-1); }
    if(e.key==='ArrowLeft' || e.key==='a'){ nudge(); rig.yaw += 0.42; }
    if(e.key==='ArrowRight'|| e.key==='d'){ nudge(); rig.yaw -= 0.42; }
  }
});


/* ---- held-key movement ------------------------------------------------
   Tracked as a set and integrated in the frame loop rather than stepped on
   keydown, so movement is smooth, diagonals work, and speed doesn't depend on
   the OS key-repeat rate. Cleared on blur — otherwise tabbing away mid-press
   leaves the camera drifting forever. */
const heldKeys = new Set();
const MOVE_KEYS = new Set(['w','a','s','d','q','e',
  'arrowup','arrowdown','arrowleft','arrowright','pageup','pagedown']);

addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(!MOVE_KEYS.has(k)) return;
  if(rig.mode !== 'aerial') return;          // the tour binds these to walking
  e.preventDefault();
  heldKeys.add(k);
});
addEventListener('keyup', e=>{ heldKeys.delete(e.key.toLowerCase()); });
addEventListener('blur', ()=>heldKeys.clear());

/* Translate the orbit target across the site. Forward is where the camera is
   looking, flattened to the ground plane, so the controls stay oriented to what
   you see rather than to world axes. Speed scales with distance: a nudge covers
   the same fraction of the screen whether you're overhead or down at lot level. */
const MOVE_BOUND = 200, MOVE_Y = [0, 90];
function moveStep(dt){
  if(!heldKeys.size) return;
  const f = (heldKeys.has('w') || heldKeys.has('arrowup')   ? 1 : 0)
          - (heldKeys.has('s') || heldKeys.has('arrowdown') ? 1 : 0);
  const r = (heldKeys.has('d') || heldKeys.has('arrowright') ? 1 : 0)
          - (heldKeys.has('a') || heldKeys.has('arrowleft')  ? 1 : 0);
  const u = (heldKeys.has('e') || heldKeys.has('pageup')   ? 1 : 0)
          - (heldKeys.has('q') || heldKeys.has('pagedown') ? 1 : 0);
  if(!f && !r && !u) return;

  nudge();                                   // moving counts as taking the wheel
  const th = rig.gTheta;
  // camera sits at target + (sin, ., cos)*radius and looks back at it
  const fx = -Math.sin(th), fz = -Math.cos(th);
  const rx =  Math.cos(th), rz = -Math.sin(th);
  const norm = (f && r) ? 0.7071 : 1;        // no diagonal speed bonus
  const sp = rig.gRadius * 0.55 * dt * norm;

  rig.gTarget.x = clamp(rig.gTarget.x + (fx*f + rx*r) * sp, -MOVE_BOUND, MOVE_BOUND);
  rig.gTarget.z = clamp(rig.gTarget.z + (fz*f + rz*r) * sp, -MOVE_BOUND, MOVE_BOUND);
  if(u) rig.gTarget.y = clamp(rig.gTarget.y + u * rig.gRadius * 0.30 * dt, MOVE_Y[0], MOVE_Y[1]);
}

/* One definition of what zoom means per mode. The buttons only exist on the
   aerial view; inside a tour the wheel still routes through here, so scroll
   keeps working on the overhead views and the walk-mode lens. */
function zoomBy(sign, step){
  step = step || 0.09;
  nudge();
  if(rig.mode === 'aerial')
    rig.gRadius = clamp(rig.gRadius * (1 + sign*step), 70, 420);
  else if(rig.mode === 'interior' && rig.view !== 'walk')
    rig.gRadius = clamp(rig.gRadius * (1 + sign*step), 14, 260);
  else if(rig.mode === 'interior'){
    camera.fov = clamp(camera.fov + sign*(step > 0.12 ? 6 : 3), 34, 76);
    camera.updateProjectionMatrix();
  }
}

/* Orbit playback. A deliberate pause is stickier than the automatic one: the
   idle timer must not quietly start the orbit again behind the user's back. */
/* ---- transport: guided tour, orbit, reset -------------------------------
   Play no longer drives the orbit. It runs the points of interest as a tour,
   holding each card long enough to read before moving on, and the orbit gets a
   button of its own. That button reports state rather than owning it: anything
   that stops the orbit — a drag, opening a pin, starting the tour — unlights it
   on the next frame, so it can never claim to be running when it isn't. */
const orbitBtn = document.getElementById('orbitBtn');
const resetBtn = document.getElementById('resetBtn');
const TOUR_DWELL = 5000;        // long enough to read a card, short enough to keep moving
let tourOn = false, tourT = 0;

function syncPlay(){
  playBtn.classList.toggle('paused', !tourOn);
  playBtn.classList.toggle('on', tourOn);
  playBtn.setAttribute('aria-pressed', tourOn ? 'true' : 'false');
  const lbl = tourOn ? 'Pause guided tour' : 'Play guided tour';
  playBtn.setAttribute('aria-label', lbl);
  playBtn.setAttribute('title', lbl);
  orbitBtn.classList.toggle('on', rig.auto);
  orbitBtn.setAttribute('aria-pressed', rig.auto ? 'true' : 'false');
}

function setTour(on){
  tourOn = on; tourT = 0;
  if(on){
    // the tour owns the camera: userPaused keeps the idle timer from restarting
    // the orbit underneath it
    rig.auto = false; rig.userPaused = true; rig.idle = 0;
    if(!activePOI) selectPOI(POIS[0]);
  }
  syncPlay();
}
playBtn.addEventListener('click', e=>{ e.stopPropagation(); setTour(!tourOn); });

orbitBtn.addEventListener('pointerdown', e=>e.stopPropagation());
orbitBtn.addEventListener('click', e=>{
  e.stopPropagation();
  const on = !rig.auto;
  // an open card holds the orbit still, so orbiting means letting go of it
  if(on){ setTour(false); closeCard({}); }
  rig.auto = on; rig.userPaused = !on; rig.idle = 0;
  syncPlay();
});

resetBtn.addEventListener('pointerdown', e=>e.stopPropagation());
resetBtn.addEventListener('click', e=>{
  e.stopPropagation();
  setTour(false);
  closeCard({});
  camera.fov = AERIAL_FOV; camera.updateProjectionMatrix();
  rig.gTarget.copy(HOME.target);
  rig.gTheta  = nearestAngle(rig.gTheta, HOME.theta);   // short way round, never a spin
  rig.gPhi    = HOME.phi;
  rig.gRadius = HOME.radius;
  rig.auto = true; rig.userPaused = false; rig.idle = 0;  // the state it opens in
  syncPlay();
});
syncPlay();

async function enterInterior(poi){
  const cfg = INTERIORS[poi.interior] || INTERIORS.lobby;
  rig.mode = 'transition';
  document.getElementById('hint').style.opacity = 0;
  card.classList.remove('show');
  poiLayer.style.opacity = 0;
  aerialTransport.classList.add('hide');
  aerialRight.classList.add('hide');  setMoreAerial(false);
  brandLabel.classList.add('hide');

  // save aerial state to return to
  savedAerial = {target:rig.gTarget.clone(), theta:rig.gTheta, phi:rig.gPhi, radius:rig.gRadius};

  // 1) fade the aerial view out — no camera move, the cut happens under cover
  await fade(1, 460);

  // 2) swap scene
  clearInterior();
  cfg.build();
  activeScene = interior;
  tour.cfg = cfg; tour.i = 0;
  rig.mode = 'interior';
  rig.view = 'walk';
  setClip('interior');
  camera.fov = INTERIOR_FOV; camera.updateProjectionMatrix();
  markView('walk');
  setMeasuring(false);
  clearMeasures();
  setCeiling(true);
  rig.auto = true; rig.idle = 0; rig.yaw = 0; rig.pitch = 0;
  const s0 = cfg.stops[0];
  buildSweeps(cfg);
  rig.pos.fromArray(s0.pos);
  const l0 = new THREE.Vector3().fromArray(s0.look).sub(new THREE.Vector3().fromArray(s0.pos));
  rig.yaw = Math.atan2(l0.x, l0.z);
  rig.pitch = Math.atan2(l0.y, Math.hypot(l0.x, l0.z));
  tour.i = 0;
  goToSweep(0, true);
  showSweeps(true);
  document.getElementById('walkHint').classList.add('show');
  applyInterior();
  document.getElementById('intName').textContent = cfg.name;
  intUI.classList.add('show');

  await fade(0, 620);
}

async function exitInterior(){
  rig.mode = 'transition';
  document.getElementById('walkHint').classList.remove('show');
  document.getElementById('roomName').classList.remove('show');
  clearSweeps();
  setMore(false);
  setMeasuring(false);
  clearMeasures();
  intUI.classList.remove('show');
  await fade(1, 460);
  activeScene = exterior;
  setClip('aerial');
  camera.fov = AERIAL_FOV; camera.updateProjectionMatrix();
  clearInterior();
  tour.cfg = null;
  // land exactly on the framing we left from — the fade covers the change, so
  // there's no swoop back out to match the old fly-in
  const a = savedAerial || HOME;
  rig.target.copy(a.target); rig.gTarget.copy(a.target);
  rig.theta  = a.theta;  rig.gTheta  = a.theta;
  rig.phi    = a.phi;    rig.gPhi    = a.phi;
  rig.radius = a.radius; rig.gRadius = a.radius;
  applyAerial();
  rig.mode = 'aerial';
  rig.auto = false; rig.idle = 0;
  document.getElementById('hint').style.opacity = 1;
  poiLayer.style.opacity = 1;
  aerialTransport.classList.remove('hide');
  aerialRight.classList.remove('hide');  brandLabel.classList.remove('hide');
  await fade(0, 620);
}
document.getElementById('exitBtn').addEventListener('click', e=>{ e.stopPropagation(); exitInterior(); });



/* ==================================================== SHOWCASE TOOLS
   Matterport-style view modes over the same interior geometry:
     walk       - the scripted waypoint tour (default)
     dollhouse  - orbit the room shell from outside, ceiling off
     floorplan  - locked top-down plan view, ceiling off
   plus a two-point measure tool and an overflow menu. */

const ceilings = [];                      // ceiling planes, filled by the interior builders
let ceilingHidden = false;

const viewSwitch = document.getElementById('viewSwitch');
// the switch renders its own state from this attribute: knob position + glyph fill
const markView = v => viewSwitch.setAttribute('data-view', v);
