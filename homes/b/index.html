<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Cedar Ridge — Community Tour</title>
<style>
  :root{
    --ink:#0b1220;
    --ink-2:#1a2536;
    --paper:#ffffff;
    --muted:#68758a;
    --line:rgba(11,18,32,.10);
    --accent:#2f7df6;
    --accent-deep:#1b5fd0;
    --radius:14px;
    --shadow-lg:0 24px 60px -18px rgba(9,16,30,.45), 0 4px 14px rgba(9,16,30,.14);
    --shadow-sm:0 6px 18px -6px rgba(9,16,30,.35);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#0a1017;font-family:var(--font);-webkit-font-smoothing:antialiased}
  canvas{display:block;position:fixed;inset:0;touch-action:none}

  /* ---------- generic ui ---------- */
  .ui{position:fixed;z-index:20}
  .pill{
    background:rgba(255,255,255,.92);backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid rgba(255,255,255,.6);border-radius:999px;
    box-shadow:var(--shadow-sm);color:var(--ink);
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ---------- top bar ---------- */
  #brandLabel{top:18px;left:18px;
    transition:opacity .4s ease,transform .4s cubic-bezier(.22,1,.36,1),visibility 0s 0s}
  /* the interior tour has its own title bar — hide the campus label there */
  #brandLabel.hide{opacity:0;visibility:hidden;transform:translateY(-8px);
    transition:opacity .35s ease,transform .35s ease,visibility 0s .35s}

  /* ---------- aerial controls: enter + orbit playback ---------- */
  #aerialBar{position:fixed;z-index:30;left:50%;bottom:64px;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;
    transition:opacity .35s,visibility 0s 0s}
  #aerialBar.hide{opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}

  /* same dark surface as the interior toolbar, sized up as the primary action */
  /* Aerial controls use the showcase idiom: the same 38px surface, drawn in SVG
     with a stroked hairline rather than a CSS border, and the same hover. */
  #enterBtn{gap:8px}
  #enterBtn .lbl{font-size:12.5px;font-weight:650;letter-spacing:-.01em;color:#fff}
  #enterBtn .ico{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round}

  /* transport glyphs are solid shapes, not outlines */
  #playBtn .btn-fg{fill:#fff}
  #playBtn .ico-play{display:none}
  #playBtn.paused .ico-pause{display:none}
  #playBtn.paused .ico-play{display:block}
  /* the aerial view carries the Matterport lockup on its own, no pill.
     A drop shadow keeps the white artwork readable against the bright sky. */
  #brandLabel .logo{height:27px;width:auto;display:block;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.5)) drop-shadow(0 0 2px rgba(0,0,0,.3))}

  /* ---------- hint ---------- */
  #hint{bottom:20px;left:50%;transform:translateX(-50%);padding:8px 16px;font-size:11.5px;color:var(--muted);
    font-weight:550;letter-spacing:.01em;transition:opacity .5s;pointer-events:none}

  /* ---------- interior HUD ---------- */
  /* visibility (not just opacity) so hidden interior controls can't be clicked from the aerial view */
  #interiorUI{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;visibility:hidden;
    transition:opacity .5s,visibility 0s .5s}
  #interiorUI.show{opacity:1;visibility:visible;transition:opacity .5s,visibility 0s 0s}
  /* full-width scrim across the top, fading out vertically — sits behind every
     piece of top chrome, not just the logo block */
  #topScrim{position:absolute;top:0;left:0;right:0;height:184px;pointer-events:none;
    background:linear-gradient(to bottom,
      rgba(9,15,25,.72) 0%,
      rgba(9,15,25,.52) 26%,
      rgba(9,15,25,.28) 55%,
      rgba(9,15,25,.09) 80%,
      rgba(9,15,25,0)   100%)}

  /* the same treatment rising from the bottom, sitting the toolbar and the
     overflow button on a readable base */
  #bottomScrim{position:absolute;bottom:0;left:0;right:0;height:168px;pointer-events:none;
    background:linear-gradient(to top,
      rgba(9,15,25,.66) 0%,
      rgba(9,15,25,.46) 28%,
      rgba(9,15,25,.24) 56%,
      rgba(9,15,25,.08) 80%,
      rgba(9,15,25,0)   100%)}

  /* branded overlay block, drawn straight onto the scene rather than in a pill */
  #intTop{position:absolute;top:0;left:0;padding:20px 22px 24px 22px;pointer-events:none;color:#fff}
  #intTop .brand{display:flex;align-items:center}
  /* official lockup: mark + wordmark in one artwork, sized by height */
  #intTop .logo{height:29px;width:auto;display:block}
  #intTop .name{margin-top:15px;font-size:12.5px;font-weight:700;letter-spacing:-.005em;line-height:1.35}
  #intTop .by{font-size:12.5px;font-weight:600;opacity:.88;letter-spacing:-.005em;line-height:1.35}





  /* ---------- showcase toolbar: supplied Figma assets ---------- */
  /* Surface values come from the assets: #333 at 70% behind a #707070 hairline. */
  .tbtn{
    background:rgba(51,51,51,.70);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(112,112,112,.5);border-radius:999px;
    color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;
    height:38px;padding:0 16px;position:relative;
    font-size:12.5px;font-weight:650;letter-spacing:-.01em;
    transition:background .16s,transform .12s;
  }
  .tbtn:hover{background:rgba(74,74,76,.8)}
  .tbtn:active{transform:scale(.97)}
  .tbtn.circ{width:38px;padding:0}
  .tbtn svg{width:19px;height:19px;stroke:#fff;stroke-width:1.7;fill:none;
    stroke-linecap:round;stroke-linejoin:round}

  #tools{position:absolute;bottom:22px;left:22px;pointer-events:auto;
    display:flex;align-items:center;gap:8px}


  /* --- circular tools: the asset draws its own surface --- */
  .iconbtn{position:relative;width:38px;height:38px;padding:0;border:none;background:none;
    transition:transform .12s}
  .iconbtn:active{transform:scale(.96)}
  .iconbtn > svg{width:38px;height:38px;display:block;overflow:hidden}
  /* the Outside pill is the same surface, just a wider asset */
  .iconbtn.wide{width:95px}
  .iconbtn.wide > svg{width:95px;height:38px}
  .iconbtn .btn-bg{fill:rgba(51,51,51,.70)}
  .iconbtn .btn-ring{fill:none;stroke:rgba(112,112,112,.5);stroke-width:1}
  .iconbtn .btn-fg{fill:#fff}
  .iconbtn:hover .btn-bg{fill:rgba(74,74,76,.82)}
  /* armed / active inverts, matching the supplied white variant */
  .iconbtn.on .btn-bg{fill:#fff}
  .iconbtn.on .btn-fg{fill:#333}
  .iconbtn.on:hover .btn-bg{fill:#f2f2f2}

  /* --- 3-way view switch --- */
  #viewSwitch{position:relative;width:110px;height:38px;flex:none}
  #viewSwitch > svg{width:110px;height:38px;display:block;overflow:hidden}
  #viewSwitch .sw-pill{fill:rgba(51,51,51,.70)}
  #viewSwitch .sw-pill-ring,
  #viewSwitch .knob-ring{fill:none;stroke:rgba(112,112,112,.5);stroke-width:1}
  #viewSwitch .knob-bg{fill:#fff}
  #viewSwitch .g{fill:#fff;transition:fill .2s}
  /* the knob slides between the three slot centres: 19, 55, 91 */
  #viewSwitch .sw-knob{transition:transform .3s cubic-bezier(.22,1,.36,1)}
  #viewSwitch[data-view="dollhouse"] .sw-knob{transform:translateX(0)}
  #viewSwitch[data-view="floorplan"] .sw-knob{transform:translateX(36px)}
  #viewSwitch[data-view="walk"]      .sw-knob{transform:translateX(72px)}
  #viewSwitch[data-view="dollhouse"] .g-dollhouse,
  #viewSwitch[data-view="floorplan"] .g-floorplan,
  #viewSwitch[data-view="walk"]      .g-walk{fill:#333}
  /* transparent hit areas over each slot */
  #viewSwitch .sw-hit{position:absolute;top:0;height:38px;width:36px;border:none;background:none;padding:0}
  #viewSwitch .sw-hit:nth-of-type(1){left:0}
  #viewSwitch .sw-hit:nth-of-type(2){left:37px}
  #viewSwitch .sw-hit:nth-of-type(3){left:73px}

  .tbtn .tip,.iconbtn .tip,.sw-hit .tip,.rtbtn .tip{position:absolute;bottom:calc(100% + 9px);left:50%;
    transform:translateX(-50%) translateY(4px);
    background:rgba(20,20,22,.94);color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.01em;
    padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s}
  .tbtn:hover .tip,.iconbtn:hover .tip,.sw-hit:hover .tip,.rtbtn:hover .tip{opacity:1;transform:translateX(-50%)}

  /* ---------- right-hand cluster: share · overflow · AI ---------- */
  #rightTools{position:absolute;bottom:22px;right:22px;pointer-events:auto;
    display:flex;align-items:center;gap:4px}
  .rtbtn{padding:0;border:none;background:none;position:relative;transition:transform .12s}
  .rtbtn:active{transform:scale(.96)}
  .rtbtn > svg{display:block;overflow:hidden}   /* these viewBoxes crop a shared artwork */
  /* share + overflow share the same surface treatment as the left toolbar */
  .rtbtn.dark{width:38px;height:38px}
  .rtbtn.dark > svg{width:38px;height:38px}
  .rtbtn.dark .btn-bg{fill:rgba(51,51,51,.70)}
  .rtbtn.dark .btn-ring{fill:none;stroke:rgba(112,112,112,.5);stroke-width:1}
  .rtbtn.dark .btn-fg{fill:#fff}
  .rtbtn.dark:hover .btn-bg{fill:rgba(74,74,76,.82)}
  /* the AI button is a white pill with a gradient ring — its own thing */
  .rtbtn.ai{width:42px;height:42px}
  /* inset by 1px so the white sits exactly under the 40px gradient ring
     rather than peeking outside it */
  .rtbtn.ai::before{content:"";position:absolute;inset:1px;border-radius:50%;background:#fff}
  .rtbtn.ai > svg{position:relative;width:42px;height:42px}
  .rtbtn.ai:hover{filter:brightness(1.04) saturate(1.08)}

  #moreMenu{position:absolute;bottom:74px;right:22px;width:224px;padding:6px;pointer-events:auto;
    background:rgba(32,32,34,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.10);border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.45);
    opacity:0;visibility:hidden;transform:translateY(6px) scale(.97);transform-origin:100% 100%;
    transition:opacity .2s,transform .24s cubic-bezier(.22,1,.36,1),visibility 0s .24s}
  #moreMenu.open{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .24s cubic-bezier(.22,1,.36,1),visibility 0s 0s}
  #moreMenu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:9px;
    font-size:12.5px;font-weight:600;color:#fff;letter-spacing:-.01em;text-align:left;transition:background .15s}
  #moreMenu button:hover{background:rgba(255,255,255,.10)}
  #moreMenu svg{width:15px;height:15px;stroke:rgba(255,255,255,.62);stroke-width:1.9;fill:none;
    stroke-linecap:round;stroke-linejoin:round;flex:none}
  #moreMenu .sep{height:1px;background:rgba(255,255,255,.12);margin:5px 8px}

  /* measurement overlay */
  #measureLayer{position:absolute;inset:0;pointer-events:none}
  .mlabel{position:absolute;transform:translate(-50%,-50%);background:var(--ink);color:#fff;
    font-size:11.5px;font-weight:650;letter-spacing:-.01em;padding:5px 9px;border-radius:8px;
    white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35)}
  .mlabel span{opacity:.6;font-weight:550;margin-left:5px}
  #measureHint{position:absolute;top:26px;left:50%;transform:translateX(-50%);background:rgba(11,18,32,.86);color:#fff;
    font-size:11.5px;font-weight:600;padding:8px 13px;border-radius:9px;pointer-events:none;
    opacity:0;transition:opacity .3s;letter-spacing:.005em}
  #measureHint.show{opacity:1}

  /* walk-mode chrome */
  #reticle{position:absolute;width:0;height:0;pointer-events:none}
  #walkHint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
    color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.01em;pointer-events:none;
    text-shadow:0 1px 10px rgba(0,0,0,.6);opacity:0;transition:opacity .45s}
  #walkHint.show{opacity:.9}
  #roomName{position:absolute;left:50%;top:26px;transform:translateX(-50%);color:#fff;
    font-size:12.5px;font-weight:650;letter-spacing:.02em;text-transform:uppercase;
    text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity .5s}
  #roomName.show{opacity:.92}

  /* ---------- zoom ---------- */
  /* aerial: bottom-right, the conventional corner and free on this view */
  #zoomAerial{position:fixed;z-index:30;right:22px;bottom:22px;
    display:flex;flex-direction:column;gap:6px;
    transition:opacity .35s,visibility 0s 0s}
  #zoomAerial.hide{opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}

  @media (max-width:720px){
    #tools{bottom:16px;left:14px;gap:6px}
    .tbtn{height:38px;padding:0 13px;font-size:12px}
    .tbtn.circ{width:38px}
    .tbtn svg{width:17px;height:17px}
    .tbtn .tip{display:none}
    #moreBtn{width:38px;height:38px}
    #intTop{padding:14px 16px 18px 16px}
    #topScrim{height:148px}
    #bottomScrim{height:132px}
    #intTop .logo{height:24px}
    #rightTools{bottom:16px;right:14px}
    #zoomAerial{right:14px;bottom:16px}
    #moreMenu{bottom:64px;right:14px}
  }

  /* ---------- transition veil ---------- */
  #veil{position:fixed;inset:0;z-index:60;background:#0a1017;opacity:0;pointer-events:none;transition:opacity .001s}
  #vignette{position:fixed;inset:0;z-index:10;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(6,12,22,.42) 100%)}

  /* ---------- loading screen ---------- */
  /* Dims the live scene rather than covering it, so the space still shows
     through behind the branding. */
  #loader{position:fixed;inset:0;z-index:80;
    color:#fff;font-family:var(--font);text-align:center;
    background:rgba(0,0,0,.42);
    transition:opacity .7s ease}
  #loader.gone{opacity:0;pointer-events:none}

  /* the aerial label, hint and controls fade in only once loading finishes */
  body.loading #brandLabel,
  body.loading #aerialBar,
  body.loading #zoomAerial,
  body.loading #hint{opacity:0;visibility:hidden;pointer-events:none}

  #loader .ldTitle{position:absolute;top:18%;left:50%;transform:translateX(-50%);
    font-size:clamp(21px,3.4vw,34px);font-weight:400;letter-spacing:-.005em;line-height:1.2;
    white-space:nowrap;text-shadow:0 2px 18px rgba(0,0,0,.45)}

  #loader .ldRing{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:96px;height:96px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}
  /* rotating the whole svg is invisible on the full-circle track, so only the
     dashed segment reads as movement */
  #loader .ldRing svg{width:100%;height:100%;animation:ldspin 1.25s linear infinite}
  #loader .ldLabel{position:absolute;inset:0;display:grid;place-items:center;
    font-size:8.5px;font-weight:700;letter-spacing:.19em;text-transform:uppercase}
  @keyframes ldspin{to{transform:rotate(360deg)}}

  #loader .ldKicker{font-size:9.5px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;
    opacity:.9;text-shadow:0 1px 10px rgba(0,0,0,.45)}
  #loader .ldCredit{position:absolute;top:62%;left:50%;transform:translateX(-50%)}
  #loader .ldCredit .ldBrand{margin-top:10px;font-size:clamp(19px,2.9vw,29px);font-weight:400;
    letter-spacing:-.005em;text-shadow:0 2px 16px rgba(0,0,0,.45)}

  #loader .ldPowered{position:absolute;bottom:7.5%;left:50%;transform:translateX(-50%)}
  #loader .ldLogo{height:26px;width:auto;display:block;margin:11px auto 0;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.35))}

  @media (max-width:520px){
    #loader .ldTitle{top:14%;font-size:19px}
    #loader .ldRing{width:80px;height:80px}
    #loader .ldLogo{height:21px}
  }

  @media (max-width:640px){
    .poi .lbl{font-size:11px}
    #hint{display:none}
    #brandLabel .logo{height:22px}
    #stops{max-width:52vw;overflow-x:auto}
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================================
   COSTAR GROUP OFFICE — simplified building tour prototype
   Custom camera rig (orbit + interior dolly), POI system, dual-scene tours.
   ========================================================================== */
(function(){
'use strict';

const IDLE_RESUME_MS = 10000;   // resume autoplay after 10s of no interaction

/* ---------------------------------------------------------------- renderer */
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const AERIAL_FOV   = 46;                  // tight lens flatters the campus massing
const INTERIOR_FOV = 60;                  // wide lens takes in a whole room
const camera = new THREE.PerspectiveCamera(AERIAL_FOV, innerWidth/innerHeight, 0.5, 3000);

/* ------------------------------------------------------------------ scenes */
const exterior = new THREE.Scene();
exterior.fog = new THREE.Fog(0xcfe0f2, 320, 900);

const interior = new THREE.Scene();
interior.fog = new THREE.Fog(0xdfe7f0, 60, 220);

let activeScene = exterior;

/* --------------------------------------------------------------- materials */
const M = {
  glass:      new THREE.MeshStandardMaterial({color:0x8fb4d8, metalness:.85, roughness:.14}),
  glassDark:  new THREE.MeshStandardMaterial({color:0x4d6f92, metalness:.9,  roughness:.2}),
  spandrel:   new THREE.MeshStandardMaterial({color:0xf2f4f7, metalness:.1,  roughness:.62}),
  stone:      new THREE.MeshStandardMaterial({color:0xdcd8d0, metalness:0,   roughness:.85}),
  stoneDark:  new THREE.MeshStandardMaterial({color:0xb8b3aa, metalness:0,   roughness:.9}),
  concrete:   new THREE.MeshStandardMaterial({color:0xc3c6c9, metalness:0,   roughness:.95}),
  asphalt:    new THREE.MeshStandardMaterial({color:0x50555c, metalness:0,   roughness:1}),
  grass:      new THREE.MeshStandardMaterial({color:0x7fa25c, metalness:0,   roughness:1}),
  grassDark:  new THREE.MeshStandardMaterial({color:0x6b8d4c, metalness:0,   roughness:1}),
  paver:      new THREE.MeshStandardMaterial({color:0xd7cfc2, metalness:0,   roughness:.9}),
  water:      new THREE.MeshStandardMaterial({color:0x2f6f9e, metalness:.6,  roughness:.12}),
  trunk:      new THREE.MeshStandardMaterial({color:0x6b5545, metalness:0,   roughness:1}),
  leaf:       new THREE.MeshStandardMaterial({color:0x4f7f42, metalness:0,   roughness:.95, flatShading:true}),
  leafLight:  new THREE.MeshStandardMaterial({color:0x679a4e, metalness:0,   roughness:.95, flatShading:true}),
  metal:      new THREE.MeshStandardMaterial({color:0x9aa3ad, metalness:.8,  roughness:.35}),
  accent:     new THREE.MeshStandardMaterial({color:0x2f7df6, metalness:.2,  roughness:.5}),
  white:      new THREE.MeshStandardMaterial({color:0xffffff, metalness:0,   roughness:.55}),
  woodLight:  new THREE.MeshStandardMaterial({color:0xd9b98c, metalness:0,   roughness:.7}),
  woodDark:   new THREE.MeshStandardMaterial({color:0x8b6a45, metalness:0,   roughness:.75}),
  carpet:     new THREE.MeshStandardMaterial({color:0x40495a, metalness:0,   roughness:1}),
  fabric:     new THREE.MeshStandardMaterial({color:0x36506e, metalness:0,   roughness:.95}),
  fabric2:    new THREE.MeshStandardMaterial({color:0xb4623f, metalness:0,   roughness:.95}),
  terrazzo:   new THREE.MeshStandardMaterial({color:0xe9e6e0, metalness:.05, roughness:.32}),
  // dedicated dark floor stone — kept separate from the pale terrazzo used on
  // the desk tops, and it gives the white floor pucks something to read against
  floorStone: new THREE.MeshStandardMaterial({color:0x4a4741, metalness:.08, roughness:.38}),
  ceiling:    new THREE.MeshStandardMaterial({color:0xf7f7f5, metalness:0,   roughness:.9}),
  intGlass:   new THREE.MeshStandardMaterial({color:0xbcd6e8, metalness:.4, roughness:.06,
                 transparent:true, opacity:.24, side:THREE.DoubleSide}),
  emissive:   new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xfff2dc, emissiveIntensity:1.6, roughness:1}),
};

/* --------------------------------------------------------------------- sky */
function makeSky(){
  const g = new THREE.SphereGeometry(1400, 32, 20);
  const m = new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false,
    uniforms:{ top:{value:new THREE.Color(0x3f7fc4)}, mid:{value:new THREE.Color(0xa9cbe8)}, bot:{value:new THREE.Color(0xe8eef2)} },
    vertexShader:'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:`
      varying vec3 vP; uniform vec3 top,mid,bot;
      void main(){
        float h = normalize(vP).y;
        vec3 c = mix(bot, mid, smoothstep(-0.12, 0.28, h));
        c = mix(c, top, smoothstep(0.22, 0.95, h));
        gl_FragColor = vec4(c,1.);
      }`
  });
  return new THREE.Mesh(g,m);
}
exterior.add(makeSky());

/* ------------------------------------------------------------------ lights */
function lightRig(scene, sunPos, intensity, ambient, shadowSpan){
  const hemi = new THREE.HemisphereLight(0xdcecff, 0x6d6a5e, ambient);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff2df, intensity);
  sun.position.set(sunPos.x, sunPos.y, sunPos.z);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  const s = shadowSpan;
  sun.shadow.camera.left=-s; sun.shadow.camera.right=s;
  sun.shadow.camera.top=s;   sun.shadow.camera.bottom=-s;
  sun.shadow.camera.near=1;  sun.shadow.camera.far=s*4;
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.6;
  scene.add(sun); scene.add(sun.target);
  const fill = new THREE.DirectionalLight(0xbfd6f2, .28);
  fill.position.set(-sunPos.x, sunPos.y*.6, -sunPos.z);
  scene.add(fill);
  return sun;
}
lightRig(exterior, {x:120,y:170,z:90}, 2.0, .62, 170);

/* ========================================================== COMMUNITY SITE
   Stands in for a large-area drone splat capture of a residential community:
   a loop road with a cul-de-sac, twelve homes on their parcels, a pocket park
   and a shared amenity pool. Geometry is stylised — the point is the tour UX
   over a big outdoor scene, not a photographic capture. */
const occluders = [];
const site = new THREE.Group();
exterior.add(site);

function box(w,h,d,mat,x,y,z,parent){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true;
  (parent||site).add(m); return m;
}
function slab(w,d,mat,x,y,z,rotY,parent){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,d), mat);
  m.rotation.x = -Math.PI/2; if(rotY) m.rotation.z = rotY;
  m.position.set(x,y,z); m.receiveShadow = true;
  (parent||site).add(m); return m;
}

/* ground */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(900,900), M.grassDark);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; site.add(ground);
slab(460,460, M.grass, 0, .02, 0);

/* ---- roads: a spine with a loop and a cul-de-sac at the north end ------- */
slab(30, 300, M.asphalt, 0, .06, 40);              // spine, running north
slab(210, 26, M.asphalt, 0, .06, 150);             // frontage at the south
const cul = new THREE.Mesh(new THREE.CircleGeometry(46, 40), M.asphalt);
cul.rotation.x = -Math.PI/2; cul.position.set(0, .06, -104); cul.receiveShadow = true; site.add(cul);
slab(150, 24, M.asphalt, -104, .06, 20);           // west branch
slab(150, 24, M.asphalt,  104, .06, 20);           // east branch
// centre lines
for(let z=-70;z<170;z+=20) slab(1.1, 9, M.white, 0, .09, z);
for(let x=-170;x<170;x+=20) slab(9, 1.1, M.white, x, .09, 150);

/* ---- one house, parameterised ------------------------------------------
   Rotation faces the front door toward the street; `story` gives a taller
   two-storey mass, and the palette varies so the community doesn't read as
   twelve copies of the same object. */
const SIDING = [0xe8e2d6, 0xd8dbd6, 0xcfd6dc, 0xe4d8c8, 0xd2cec6, 0xdfe3e6];
const ROOFS  = [0x5c5a57, 0x6b5f52, 0x4f5b62, 0x726257, 0x585f5c];
const sidingMats = SIDING.map(c=> new THREE.MeshStandardMaterial({color:c, roughness:.85}));
const roofMats   = ROOFS.map(c=> new THREE.MeshStandardMaterial({color:c, roughness:.7, flatShading:true}));

function house(cfg){
  const g = new THREE.Group();
  g.position.set(cfg.x, 0, cfg.z);
  g.rotation.y = cfg.rotY || 0;
  site.add(g);

  const w = cfg.w || 22, d = cfg.d || 17, story = cfg.story || 1;
  const wallH = story === 2 ? 12.5 : 7.4;
  const siding = sidingMats[cfg.pal % sidingMats.length];
  const roof   = roofMats[cfg.pal % roofMats.length];

  // parcel: lawn, driveway, walk
  slab(w+26, d+34, M.grass, 0, .05, 2, 0, g);
  slab(9, 30, M.paver, -w/2+3, .09, d/2+16, 0, g);      // driveway to the street
  slab(3.4, 12, M.paver, 3, .10, d/2+7, 0, g);          // front walk

  // main mass
  const body = box(w, wallH, d, siding, 0, wallH/2, 0, g);
  occluders.push(body);

  // hipped roof: a squashed pyramid reads well at aerial distance
  const rf = new THREE.Mesh(new THREE.ConeGeometry(Math.hypot(w,d)/2*1.02, 5.6, 4), roof);
  rf.rotation.y = Math.PI/4; rf.position.y = wallH + 2.8; rf.castShadow = true; g.add(rf);
  occluders.push(rf);
  box(w+1.6, .5, d+1.6, roof, 0, wallH+.25, 0, g);      // eaves

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function easeInOut(t){return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;}

/* The auto-orbit lets theta accumulate without bound, so a raw assignment can
   spin the camera many turns. Always take the equivalent angle nearest to it. */
function nearestAngle(cur, target){
  const TAU = Math.PI*2;
  let d = (target - cur) % TAU;
  if(d >  Math.PI) d -= TAU;
  if(d < -Math.PI) d += TAU;
  return cur + d;
}


function applyAerial(){
  const {target, theta, phi, radius} = rig;
  const sp = Math.sin(phi), cp = Math.cos(phi);
  camera.position.set(
    target.x + radius*sp*Math.sin(theta),
    target.y + radius*cp,
    target.z + radius*sp*Math.cos(theta)
  );
  camera.lookAt(target);
}

/* --------------------------------------------------------- input handling */
const dom = renderer.domElement;
let dragging=false, lastX=0, lastY=0, moved=0;

function nudge(){                       // any user interaction
  rig.idle = 0;
  rig.auto = false;
}

dom.addEventListener('pointerdown', e=>{
  dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY;
  dom.setPointerCapture(e.pointerId); nudge();
});
dom.addEventListener('pointermove', e=>{
  if(!dragging){ hoverAt(e.clientX, e.clientY); return; }
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY; moved += Math.abs(dx)+Math.abs(dy);
  nudge();
  if(rig.mode==='aerial'){
    rig.gTheta -= dx*0.0042;
    rig.gPhi    = clamp(rig.gPhi - dy*0.0032, 0.20, 1.40);
  } else if(rig.mode==='interior' && rig.view==='walk'){
    rig.yaw  -= dx*0.0034;                                   // free 360° look
    rig.pitch = clamp(rig.pitch - dy*0.0026, -1.05, 1.05);
  } else if(rig.mode==='interior'){
    // dollhouse orbits freely; floor plan spins about the vertical axis only
    rig.gTheta -= dx*0.0052;
    if(rig.view==='dollhouse') rig.gPhi = clamp(rig.gPhi - dy*0.0034, 0.16, 1.24);
  }
});
addEventListener('pointerup', ()=>{ dragging=false; });
dom.addEventListener('wheel', e=>{
  e.preventDefault();
  zoomBy(Math.sign(e.deltaY));
}, {passive:false});
// a click on empty space (not a drag) hands the view back to the auto-orbit
dom.addEventListener('click', ev=>{
  setMore(false);
  if(measuring && rig.mode==='interior' && moved < 6){ measureAt(ev.clientX, ev.clientY); return; }
  if(rig.mode==='interior' && moved < 6 && clickSweep(ev.clientX, ev.clientY)) return;
  if(moved < 6 && rig.mode === 'aerial' && !rig.userPaused){ rig.auto = true; rig.idle = 0; }
});

// pinch zoom (aerial)

dom.addEventListener('touchstart', e=>{ if(e.touches.length===2){
  pinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }});
dom.addEventListener('touchmove', e=>{ if(e.touches.length===2 && pinch){
  const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  nudge(); if(rig.mode==='aerial') rig.gRadius = clamp(rig.gRadius * (pinch/d), 70, 420); pinch=d; }}, {passive:true});

/* One definition of what zoom means per mode. The buttons only exist on the
   aerial view; inside a tour the wheel still routes through here, so scroll
   keeps working on the overhead views and the walk-mode lens. */
function zoomBy(sign, step){
  step = step || 0.09;
  nudge();
  if(rig.mode === 'aerial')
    rig.gRadius = clamp(rig.gRadius * (1 + sign*step), 70, 420);
  else if(rig.mode === 'interior' && rig.view !== 'walk')
    rig.gRadius = clamp(rig.gRadius * (1 + sign*step), 14, 260);
  else if(rig.mode === 'interior'){
    camera.fov = clamp(camera.fov + sign*(step > 0.12 ? 6 : 3), 34, 76);
    camera.updateProjectionMatrix();
  }
}
[['zoomInA',-1],['zoomOutA',1]].forEach(([id,sign])=>{
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e=>e.stopPropagation());
  el.addEventListener('click', e=>{ e.stopPropagation(); zoomBy(sign, 0.18); });
});

/* Orbit playback. A deliberate pause is stickier than the automatic one: the
   idle timer must not quietly start the orbit again behind the user's back. */
function syncPlay(){
  const paused = !rig.auto;
  playBtn.classList.toggle('paused', paused);
  playBtn.setAttribute('aria-pressed', paused ? 'true' : 'false');
  playBtn.setAttribute('aria-label', paused ? 'Play orbit' : 'Pause orbit');
  playBtn.setAttribute('title',      paused ? 'Play orbit' : 'Pause orbit');
}
playBtn.addEventListener('click', e=>{
  e.stopPropagation();
  const running = rig.auto;
  rig.auto = !running;
  rig.userPaused = running;      // set only when this click is what paused it
  rig.idle = 0;
  syncPlay();
});

async function enterInterior(poi){
  const cfg = INTERIORS[poi.interior] || INTERIORS.lobby;
  rig.mode = 'transition';
  document.getElementById('hint').style.opacity = 0;
  aerialBar.classList.add('hide');
  zoomAerial.classList.add('hide');
  brandLabel.classList.add('hide');

  // save aerial state to return to
  savedAerial = {target:rig.gTarget.clone(), theta:rig.gTheta, phi:rig.gPhi, radius:rig.gRadius};

  // 1) fade the aerial view out — no camera move, the cut happens under cover
  await fade(1, 460);

  // 2) swap scene
  clearInterior();
  cfg.build();
  activeScene = interior;
  tour.cfg = cfg; tour.i = 0;
  rig.mode = 'interior';
  rig.view = 'walk';
  camera.fov = INTERIOR_FOV; camera.updateProjectionMatrix();
  markView('walk');
  setMeasuring(false);
  clearMeasures();
  setCeiling(true);
  rig.auto = true; rig.idle = 0; rig.yaw = 0; rig.pitch = 0;
  const s0 = cfg.stops[0];
  buildSweeps(cfg);
  rig.pos.fromArray(s0.pos);
  const l0 = new THREE.Vector3().fromArray(s0.look).sub(new THREE.Vector3().fromArray(s0.pos));
  rig.yaw = Math.atan2(l0.x, l0.z);
  rig.pitch = Math.atan2(l0.y, Math.hypot(l0.x, l0.z));
  tour.i = 0;
  goToSweep(0, true);
  showSweeps(true);
  document.getElementById('walkHint').classList.add('show');
  applyInterior();
  document.getElementById('intName').textContent = cfg.name;
  intUI.classList.add('show');

  await fade(0, 620);
}

async function exitInterior(){
  rig.mode = 'transition';
  document.getElementById('walkHint').classList.remove('show');
  document.getElementById('roomName').classList.remove('show');
  clearSweeps();
  setMore(false);
  setMeasuring(false);
  clearMeasures();
  intUI.classList.remove('show');
  await fade(1, 460);
  activeScene = exterior;
  camera.fov = AERIAL_FOV; camera.updateProjectionMatrix();
  clearInterior();
  tour.cfg = null;
  // land exactly on the framing we left from — the fade covers the change, so
  // there's no swoop back out to match the old fly-in
  const a = savedAerial || HOME;
  rig.target.copy(a.target); rig.gTarget.copy(a.target);
  rig.theta  = a.theta;  rig.gTheta  = a.theta;
  rig.phi    = a.phi;    rig.gPhi    = a.phi;
  rig.radius = a.radius; rig.gRadius = a.radius;
  applyAerial();
  rig.mode = 'aerial';
  rig.auto = false; rig.idle = 0;
  document.getElementById('hint').style.opacity = 1;
  aerialBar.classList.remove('hide');
  zoomAerial.classList.remove('hide');
  brandLabel.classList.remove('hide');
  await fade(0, 620);
}
document.getElementById('exitBtn').addEventListener('click', e=>{ e.stopPropagation(); exitInterior(); });



/* ==================================================== SHOWCASE TOOLS
   Matterport-style view modes over the same interior geometry:
     walk       - the scripted waypoint tour (default)
     dollhouse  - orbit the room shell from outside, ceiling off
     floorplan  - locked top-down plan view, ceiling off
   plus a two-point measure tool and an overflow menu. */

const ceilings = [];                      // ceiling planes, filled by the interior builders
let ceilingHidden = false;

const viewSwitch = document.getElementById('viewSwitch');
// the switch renders its own state from this attribute: knob position + glyph fill
const markView = v => viewSwitch.setAttribute('data-view', v);
const measureBtn   = document.getElementById('toolMeasure');
const moreBtn      = document.getElementById('moreBtn');
const moreMenu     = document.getElementById('moreMenu');
const measureLayer = document.getElementById('measureLayer');
const measureHint  = document.getElementById('measureHint');

function setCeiling(visible){
  ceilingHidden = !visible;
  ceilings.forEach(c=>{ c.visible = visible; });
  // ceiling-mounted light strips share one material, so they can be found by reference
  interiorRoot.traverse(o=>{ if(o.material === M.emissive) o.visible = visible; });
  const lbl = document.getElementById('mmCeilingLabel');
  if(lbl) lbl.textContent = visible ? 'Hide ceiling' : 'Show ceiling';
}

/* ---- frame the whole room for the overhead modes ---- */
function shellFrame(view){
  const c = tour.cfg || {w:50, d:32, h:10};
  const vfov = camera.fov*Math.PI/180;
  const hfov = 2*Math.atan(Math.tan(vfov/2)*camera.aspect);
  const rV = (c.d*0.62) / Math.tan(vfov*0.5);
  const rH = (c.w*0.62) / Math.tan(hfov*0.5);
  const fit = Math.max(rV, rH);
  return {
    target:new THREE.Vector3(0, view==='floorplan' ? 0 : c.h*0.35, 0),
    theta: view==='floorplan' ? 0 : Math.PI*0.22,
    // near-zero tilt rather than exactly zero: straight down is degenerate for lookAt
    phi:   view==='floorplan' ? 0.05 : 0.86,
    radius: view==='floorplan' ? fit*0.95 : fit*1.06,
  };
}

function setView(view){
  if(rig.mode !== 'interior' && rig.mode !== 'transition') return;
  rig.view = view;
  markView(view);
  const walking = (view === 'walk');
  setCeiling(walking);
  showSweeps(true);
  document.getElementById('walkHint').classList.toggle('show', walking);
  if(walking){
    // stand back up at the current sweep, keeping whatever way you were facing
    if(sweeps.length) rig.pos.copy(sweeps[tour.i].pos);
    travel = null;
    markHere();
  } else {
    document.getElementById('roomName').classList.remove('show');
    const f = shellFrame(view);
    rig.gTarget.copy(f.target);
    rig.gTheta = nearestAngle(rig.theta, f.theta);
    rig.gPhi   = f.phi;
    rig.gRadius= f.radius;
    // start the ease from wherever the walk camera was standing
    rig.target.copy(f.target);
    rig.theta  = rig.gTheta;
    rig.phi    = clamp(rig.phi, 0.05, 1.4);
    rig.radius = Math.max(rig.radius, 12);
  }
  rig.auto = true; rig.idle = 0;
}
viewSwitch.querySelectorAll('.sw-hit').forEach(b=>{
  b.addEventListener('pointerdown', e=>e.stopPropagation());
  b.addEventListener('click', e=>{ e.stopPropagation(); setView(b.dataset.view); });
});
// decorative in this prototype — no levels or furnishings data behind them yet
document.getElementById('toolLevels').addEventListener('click', e=>e.stopPropagation());
document.getElementById('toolFurniture').addEventListener('click', e=>e.stopPropagation());

/* ---- measure: two raycast hits, a line, and a label ---- */
const mRay = new THREE.Raycaster();
let measuring = false;
const measures = [];        // {a, b, line, dots[], label}
let pending = null;         // first point of an in-progress measurement

const mDotGeo = new THREE.SphereGeometry(0.13, 12, 10);
const mDotMat = new THREE.MeshBasicMaterial({color:0xffffff});
const mLineMat = new THREE.LineBasicMaterial({color:0xffffff});

function setMeasuring(on){
  measuring = on;
  measureBtn.classList.toggle('on', on);
  measureHint.classList.toggle('show', on);
  if(!on && pending){ interior.remove(pending.dot); pending = null; }
}
measureBtn.addEventListener('click', e=>{ e.stopPropagation(); setMeasuring(!measuring); });

function feetInches(m){
  const totalIn = m * 39.3701;
  const ft = Math.floor(totalIn / 12);
  const inch = Math.round(totalIn - ft*12);
  return inch === 12 ? (ft+1)+"' 0\"" : ft+"' "+inch+'"';
}

function measureAt(clientX, clientY){
  const ndcv = new THREE.Vector2(
    (clientX/innerWidth)*2 - 1,
    -(clientY/innerHeight)*2 + 1
  );
  mRay.setFromCamera(ndcv, camera);
  mRay.far = 400;
  const hits = mRay.intersectObject(interiorRoot, true);
  if(!hits.length) return;
  const p = hits[0].point.clone();

  const dot = new THREE.Mesh(mDotGeo, mDotMat);
  dot.position.copy(p);
  interior.add(dot);

  if(!pending){ pending = {p, dot}; return; }

  const a = pending.p, b = p;
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const line = new THREE.Line(geo, mLineMat);
  interior.add(line);

  const label = document.createElement('div');
  label.className = 'mlabel';
  const d = a.distanceTo(b);
  label.innerHTML = feetInches(d) + '<span>' + d.toFixed(2) + ' m</span>';
  measureLayer.appendChild(label);

  measures.push({a, b, line, dots:[pending.dot, dot], label});
  pending = null;
}

function clearMeasures(){
  measures.forEach(m=>{
    interior.remove(m.line); m.line.geometry.dispose();
    m.dots.forEach(d=>interior.remove(d));
    if(m.label.parentNode) m.label.parentNode.removeChild(m.label);
  });
  measures.length = 0;
  if(pending){ interior.remove(pending.dot); pending = null; }
}

function updateMeasureLabels(){
  if(!measures.length) return;
  const mid = new THREE.Vector3();
  for(const m of measures){
    mid.addVectors(m.a, m.b).multiplyScalar(0.5).project(camera);
    const vis = mid.z < 1;
    m.label.style.display = vis ? '' : 'none';
    if(!vis) continue;
    m.label.style.left = ((mid.x*0.5+0.5)*innerWidth).toFixed(1)+'px';
    m.label.style.top  = ((-mid.y*0.5+0.5)*innerHeight).toFixed(1)+'px';
  }
}

/* ---- overflow menu ---- */
function setMore(open){ moreMenu.classList.toggle('open', open); }
moreBtn.addEventListener('pointerdown', e=>e.stopPropagation());
// decorative in this prototype: swallow the events so they don't reach the scene
['aiBtn'].forEach(id=>{
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e=>e.stopPropagation());
  el.addEventListener('click', e=>e.stopPropagation());
});
moreBtn.addEventListener('click', e=>{ e.stopPropagation(); setMore(!moreMenu.classList.contains('open')); });
moreMenu.addEventListener('pointerdown', e=>e.stopPropagation());
document.getElementById('mmReset').addEventListener('click', e=>{
  e.stopPropagation(); setMore(false);
  camera.fov = INTERIOR_FOV; camera.updateProjectionMatrix();
  setView(rig.view || 'walk');
});
document.getElementById('mmCeiling').addEventListener('click', e=>{
  e.stopPropagation(); setMore(false); setCeiling(ceilingHidden);
});
document.getElementById('mmClear').addEventListener('click', e=>{
  e.stopPropagation(); setMore(false); clearMeasures(); setMeasuring(false);
});
document.getElementById('mmExit').addEventListener('click', e=>{
  e.stopPropagation(); setMore(false); exitInterior();
});
document.getElementById('tools').addEventListener('pointerdown', e=>e.stopPropagation());

/* ------------------------------------------- walk mode: sweep navigation
   Matterport moves you between fixed capture positions ("sweeps") shown as
   rings on the floor. You click a ring to travel to it, drag to look around
   from where you stand, and scroll to zoom. There is no scripted playback. */

const SWEEP_Y = 0.10;                     // puck height above the floor
const sweeps = [];                        // {pos, ring, disc, pick, label}
let   hoverSweep = null;
let   travel = null;                      // {from, to, t, dur} while moving

/* Showcase pucks are plain white rings that brighten on hover — they never
   change size. A third, fully transparent disc fills the hole so the hit area
   covers the whole circle rather than just the thin band. */
const ringGeo = new THREE.RingGeometry(1.70, 2.60, 48);   // thicker band reads from further off
const discGeo = new THREE.CircleGeometry(0.66, 28);
const pickGeo = new THREE.CircleGeometry(2.60, 28);

const flat = (color, opacity)=> new THREE.MeshBasicMaterial({
  color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false });

const ringMat  = flat(0xffffff, .85);     // resting
const ringHot  = flat(0xffffff, 1);       // under the cursor
const ringHere = flat(0xffffff, .92);     // where you're standing
const discMat  = flat(0xffffff, .68);
const discHot  = flat(0xffffff, 1);
const discHere = flat(0xffffff, .80);
const pickMat  = flat(0xffffff, 0);       // invisible, but still raycastable

function clearSweeps(){
  sweeps.forEach(s=>{ interiorRoot.remove(s.ring); interiorRoot.remove(s.disc); interiorRoot.remove(s.pick); });
  sweeps.length = 0;
  hoverSweep = null;
  travel = null;
}

/* ---- is this spot actually standable? ----------------------------------
   Cast straight down: the first thing hit must be the floor, not a desk or a
   planter. Then check horizontal clearance so pucks never hug a wall. */
const probe = new THREE.Raycaster();
const DOWN  = new THREE.Vector3(0,-1,0);
const SIDES = [];
for(let i=0;i<8;i++) SIDES.push(new THREE.Vector3(Math.cos(i*Math.PI/4), 0, Math.sin(i*Math.PI/4)));

function standable(p, clearance){
  probe.set(p, DOWN);
  probe.far = p.y + 1.5;
  const below = probe.intersectObject(interiorRoot, true);
  if(!below.length) return false;             // no floor here at all
  if(below[0].point.y > 0.45) return false;   // standing on furniture

  let blocked = 0;
  for(const dir of SIDES){
    probe.set(p, dir);
    probe.far = clearance;
    if(probe.intersectObject(interiorRoot, true).length) blocked++;
    if(blocked > 2) return false;             // boxed in on three or more sides
  }
  return true;
}

/* Pucks are laid out on a grid across the whole floor plate, seeded with the
   authored vantage points so the good views are always reachable. */
function buildSweeps(cfg){
  clearSweeps();
  const eye = cfg.stops[0].pos[1];
  const step = Math.max(7, Math.min(cfg.w, cfg.d) / 4.2);
  const pts = [];

  cfg.stops.forEach(s=>{
    pts.push({pos:new THREE.Vector3().fromArray(s.pos), label:s.cap ? s.cap[0] : s.label});
  });

  const far = (v)=> pts.every(p=> Math.hypot(p.pos.x-v.x, p.pos.z-v.z) > step*0.72);
  const halfW = cfg.w/2 - 3.5, halfD = cfg.d/2 - 3.5;
  for(let x = -halfW; x <= halfW; x += step){
    for(let z = -halfD; z <= halfD; z += step){
      const v = new THREE.Vector3(x, eye, z);
      if(!far(v)) continue;
      if(!standable(v, 2.6)) continue;
      pts.push({pos:v, label:null});
    }
  }

  pts.forEach(p=>{
    const pick = new THREE.Mesh(pickGeo, pickMat);
    const ring = new THREE.Mesh(ringGeo, ringMat);
    const disc = new THREE.Mesh(discGeo, discMat);
    [pick, ring, disc].forEach((m,i)=>{
      m.rotation.x = -Math.PI/2;
      m.position.set(p.pos.x, SWEEP_Y + i*0.012, p.pos.z);
      m.renderOrder = 3 + i;
      interiorRoot.add(m);
    });
    sweeps.push({pos:p.pos, ring, disc, pick, label:p.label});
  });
}

function showSweeps(v){
  // the pick disc follows visibility too: hidden objects are skipped by the
  // raycaster, so invisible pucks can't be clicked
  sweeps.forEach(s=>{ s.ring.visible = v; s.disc.visible = v; s.pick.visible = v; });
}

function markHere(){
  // opacity only — the pucks never resize, so nothing jumps under the cursor
  sweeps.forEach((s,i)=>{
    const here = (i === tour.i), hot = (s === hoverSweep);
    s.ring.material = hot ? ringHot : (here ? ringHere : ringMat);
    s.disc.material = hot ? discHot : (here ? discHere : discMat);
  });
  const nm = document.getElementById('roomName');
  const lbl = sweeps[tour.i] && sweeps[tour.i].label;
  nm.textContent = lbl || '';
  nm.classList.toggle('show', !!lbl && rig.view === 'walk');
}

function goToSweep(i, instant){
  if(!sweeps.length) return;
  tour.i = ((i % sweeps.length) + sweeps.length) % sweeps.length;
  const dest = sweeps[tour.i].pos;
  if(instant || rig.view !== 'walk'){ rig.pos.copy(dest); travel = null; }
  else travel = {from:rig.pos.clone(), to:dest.clone(), t:0, dur:0.75};
  markHere();
}

/* look direction is absolute in walk mode, not an offset from a scripted shot */
function applyInterior(){
  camera.position.copy(rig.pos);
  const cp = Math.cos(rig.pitch);
  camera.lookAt(
    rig.pos.x + Math.sin(rig.yaw)*cp,
    rig.pos.y + Math.sin(rig.pitch),
    rig.pos.z + Math.cos(rig.yaw)*cp
  );
}

/* hover feedback: highlight the ring under the pointer */
const sRay = new THREE.Raycaster();
const sVec = new THREE.Vector2();
function pickSweep(cx, cy){
  if(!sweeps.length) return null;
  sVec.set((cx/innerWidth)*2 - 1, -(cy/innerHeight)*2 + 1);
  sRay.setFromCamera(sVec, camera);
  sRay.far = 500;
  // pick against the full disc, so the middle of a puck is clickable too
  const hit = sRay.intersectObjects(sweeps.map(s=>s.pick), false);
  if(!hit.length) return null;
  return sweeps.find(s=>s.pick === hit[0].object) || null;
}
function hoverAt(cx, cy){
  if(rig.mode !== 'interior' || measuring) return;
  const s = pickSweep(cx, cy);
  if(s === hoverSweep) return;
  hoverSweep = s;
  markHere();
  dom.style.cursor = s ? 'pointer' : '';
}
function clickSweep(cx, cy){
  const s = pickSweep(cx, cy);
  if(!s) return false;
  const i = sweeps.indexOf(s);
  if(rig.view !== 'walk'){ setView('walk'); goToSweep(i, true); }
  else goToSweep(i);
  return true;
}

/* arrow keys hop to the nearest sweep ahead of or behind you, like Showcase */
function stepSweep(dirSign){
  if(!sweeps.length) return;
  const here = rig.pos;
  const fwd = new THREE.Vector3(Math.sin(rig.yaw), 0, Math.cos(rig.yaw)).multiplyScalar(dirSign);
  let best = -1, bestScore = Infinity;
  sweeps.forEach((s,i)=>{
    if(i === tour.i) return;
    const to = new THREE.Vector3().subVectors(s.pos, here); to.y = 0;
    const d = to.length();
    if(d < 0.5) return;
    const align = to.normalize().dot(fwd);        // 1 = straight ahead
    if(align < 0.35) return;                      // not in front of us
    const score = d / align;
    if(score < bestScore){ bestScore = score; best = i; }
  });
  if(best >= 0) goToSweep(best);
}

document.getElementById('intTop').addEventListener('pointerdown', e=>e.stopPropagation());

/* ==================================================================== LOOP */
const clock = new THREE.Clock();

let lastAuto = true;
function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(rig.auto !== lastAuto){ lastAuto = rig.auto; syncPlay(); }

  if(rig.mode === 'aerial'){
    // idle → resume autoplay
    if(!rig.auto){
      rig.idle += dt*1000;
      if(!rig.userPaused && rig.idle >= IDLE_RESUME_MS){ rig.auto = true; rig.idle = 0; }
    }
    if(rig.auto){
      rig.gTheta += dt * 0.075;          // ~4.3°/s, a full turn in ~84s
      // ease back to the campus-wide framing when autoplay takes over again
      rig.gTarget.lerp(HOME.target, dt*0.95);
      rig.gPhi    = lerp(rig.gPhi,    HOME.phi,    dt*0.9);
      rig.gRadius = lerp(rig.gRadius, HOME.radius, dt*0.9);
    }
    const k = 1 - Math.pow(0.0016, dt);         // frame-rate independent damping
    rig.theta  = lerp(rig.theta,  rig.gTheta,  k);
    rig.phi    = lerp(rig.phi,    rig.gPhi,    k);
    rig.radius = lerp(rig.radius, rig.gRadius, k);
    rig.target.lerp(rig.gTarget, k);
    applyAerial();
  }
  else if(rig.mode === 'interior' && rig.view !== 'walk'){
    // dollhouse / floor plan: same spherical orbit as the aerial view, room-sized
    if(!rig.auto){
      rig.idle += dt*1000;
      if(rig.idle >= IDLE_RESUME_MS){ rig.auto = true; rig.idle = 0; }
    }
    if(rig.auto && rig.view === 'dollhouse') rig.gTheta += dt * 0.075;
    const k = 1 - Math.pow(0.0016, dt);
    rig.theta  = lerp(rig.theta,  rig.gTheta,  k);
    rig.phi    = lerp(rig.phi,    rig.gPhi,    k);
    rig.radius = lerp(rig.radius, rig.gRadius, k);
    rig.target.lerp(rig.gTarget, k);
    applyAerial();
  }
  else if(rig.mode === 'interior'){
    // walk mode: ease between sweeps, otherwise hold position and look freely
    if(travel){
      travel.t += dt;
      const k = Math.min(1, travel.t / travel.dur);
      rig.pos.lerpVectors(travel.from, travel.to, easeInOut(k));
      if(k >= 1) travel = null;
    }
    applyInterior();
  }

  if(rig.mode === 'interior') updateMeasureLabels();

  renderer.render(activeScene, camera);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);

});

/* --------------------------------------------------------------- kick off */
applyAerial();
renderer.compile(exterior, camera);
frame();
const LOADER_MIN_MS = 1500;      // minimum dwell so the branded screen is seen
setTimeout(()=>{
  document.getElementById('loader').classList.add('gone');
  document.body.classList.remove('loading');      // reveals the aerial chrome
  setTimeout(()=>document.getElementById('hint').style.opacity=.001, 9000);
}, LOADER_MIN_MS);

})();
</script>
</body>
