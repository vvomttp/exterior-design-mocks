<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>CoStar Group Office — Aerial Tour</title>
<style>
  :root{
    --ink:#0b1220;
    --ink-2:#1a2536;
    --paper:#ffffff;
    --muted:#68758a;
    --line:rgba(11,18,32,.10);
    --accent:#2f7df6;
    --accent-deep:#1b5fd0;
    --radius:14px;
    --shadow-lg:0 24px 60px -18px rgba(9,16,30,.45), 0 4px 14px rgba(9,16,30,.14);
    --shadow-sm:0 6px 18px -6px rgba(9,16,30,.35);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#0a1017;font-family:var(--font);-webkit-font-smoothing:antialiased}
  canvas{display:block;position:fixed;inset:0;touch-action:none}

  /* ---------- generic ui ---------- */
  .ui{position:fixed;z-index:20}
  .pill{
    background:rgba(255,255,255,.92);backdrop-filter:blur(18px) saturate(1.4);
    -webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:1px solid rgba(255,255,255,.6);border-radius:999px;
    box-shadow:var(--shadow-sm);color:var(--ink);
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ---------- top bar ---------- */
  #topLeft{top:18px;left:18px;
    transition:opacity .4s ease,transform .4s cubic-bezier(.22,1,.36,1),visibility 0s 0s}
  /* the interior tour has its own title bar — hide the campus label there */
  #topLeft.hide{opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .35s ease,transform .35s ease,visibility 0s .35s}
  #brandBtn{display:flex;align-items:center;gap:10px;padding:9px 12px 9px 12px;text-align:left;
    transition:background .18s}
  #brandBtn:hover{background:#fff}
  #topLeft .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(140deg,#2f7df6,#7db4ff);
    display:grid;place-items:center;box-shadow:0 4px 10px -2px rgba(47,125,246,.6);flex:none}
  #topLeft .mark svg{width:14px;height:14px}
  #topLeft .t{font-size:13.5px;font-weight:650;letter-spacing:-.01em;line-height:1.15}
  #topLeft .s{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.02em}
  #brandBtn .chev{width:14px;height:14px;stroke:var(--muted);stroke-width:2.2;fill:none;
    stroke-linecap:round;stroke-linejoin:round;margin-left:2px;transition:transform .25s cubic-bezier(.22,1,.36,1)}
  #topLeft.open #brandBtn .chev{transform:rotate(180deg)}
  #topLeft.open #brandBtn{background:#fff}

  /* ---------- POI dropdown ---------- */
  #brandMenu{
    position:absolute;top:calc(100% + 8px);left:0;width:306px;padding:6px;
    background:var(--paper);border-radius:16px;box-shadow:var(--shadow-lg);
    opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:24px 0;
    transition:opacity .22s ease,transform .28s cubic-bezier(.22,1,.36,1),visibility 0s .28s;
    max-height:min(74vh,520px);overflow-y:auto;
  }
  #topLeft.open #brandMenu{opacity:1;visibility:visible;transform:none;transition:opacity .22s ease,transform .28s cubic-bezier(.22,1,.36,1),visibility 0s 0s}
  #brandMenu .mh{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
    color:var(--muted);padding:9px 10px 7px}
  #brandMenu .row{display:flex;align-items:center;gap:11px;width:100%;padding:7px 9px;border-radius:11px;
    text-align:left;transition:background .15s}
  #brandMenu .row:hover{background:#f1f4f8}
  #brandMenu .row.on{background:#eef4ff}
  #brandMenu .th{width:52px;height:38px;border-radius:8px;flex:none;overflow:hidden;position:relative;
    background:#dfe4ea;box-shadow:inset 0 0 0 1px rgba(11,18,32,.07)}
  #brandMenu .th img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s}
  #brandMenu .th img.ready{opacity:1}
  #brandMenu .rtx{min-width:0;flex:1}
  #brandMenu .rl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:650;
    color:var(--ink);letter-spacing:-.012em;line-height:1.25}
  #brandMenu .rn{width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:9.5px;font-weight:700;display:grid;place-items:center;flex:none}
  #brandMenu .row.on .rl{color:var(--accent-deep)}
  #brandMenu .rs{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #brandMenu .go{width:14px;height:14px;stroke:#b7c0cd;stroke-width:2.2;fill:none;flex:none;
    stroke-linecap:round;stroke-linejoin:round;transition:stroke .15s,transform .18s}
  #brandMenu .row:hover .go{stroke:var(--accent);transform:translateX(2px)}

  #topRight{top:18px;right:18px;display:flex;gap:8px;align-items:center}
  #autoBadge{display:flex;align-items:center;gap:8px;padding:9px 15px;font-size:12px;font-weight:600;letter-spacing:-.005em}
  #autoDot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.55);animation:pulse 2.4s infinite}
  #autoBadge.paused #autoDot{background:#f59e0b;animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
  .iconbtn svg{width:16px;height:16px;stroke:var(--ink);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .iconbtn:hover{background:#fff}

  /* ---------- hint ---------- */
  #hint{bottom:22px;left:50%;transform:translateX(-50%);padding:8px 16px;font-size:11.5px;color:var(--muted);
    font-weight:550;letter-spacing:.01em;transition:opacity .5s;pointer-events:none}

  /* ---------- POI pins ---------- */
  #poiLayer{position:fixed;inset:0;z-index:15;pointer-events:none}
  .poi{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
       transition:opacity .28s ease;will-change:transform,left,top}
  .poi .stem{position:absolute;left:50%;top:100%;width:1px;height:18px;margin-left:-.5px;
       background:linear-gradient(to bottom,rgba(255,255,255,.85),rgba(255,255,255,0))}
  .poi .stem::after{content:"";position:absolute;left:-3px;top:16px;width:7px;height:7px;border-radius:50%;
       background:#fff;box-shadow:0 0 0 3px rgba(47,125,246,.35),0 2px 6px rgba(0,0,0,.4)}
  .poi .chip{
    display:flex;align-items:center;gap:8px;padding:7px 13px 7px 8px;border-radius:999px;
    background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.75);box-shadow:var(--shadow-sm);
    transform-origin:50% 120%;transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s;
    white-space:nowrap;
  }
  .poi:hover .chip{transform:scale(1.06);box-shadow:0 12px 26px -8px rgba(9,16,30,.5)}
  .poi.active .chip{background:var(--accent);border-color:rgba(255,255,255,.35)}
  .poi.active .chip .lbl{color:#fff}
  .poi.active .chip .num{background:#fff;color:var(--accent)}
  .poi .num{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;
    font-weight:700;display:grid;place-items:center;letter-spacing:-.02em}
  .poi .lbl{font-size:12px;font-weight:650;color:var(--ink);letter-spacing:-.01em}
  .poi.occluded{opacity:.22}
  .poi.hidden{opacity:0;pointer-events:none}

  /* ---------- info card ---------- */
  #card{
    position:fixed;z-index:40;right:22px;bottom:22px;width:330px;
    background:var(--paper);border-radius:18px;box-shadow:var(--shadow-lg);
    overflow:hidden;opacity:0;transform:translateY(16px) scale(.97);pointer-events:none;
    transition:opacity .3s ease,transform .34s cubic-bezier(.22,1,.36,1);
  }
  #card.show{opacity:1;transform:none;pointer-events:auto}
  /* opened from the dropdown: sits beside the menu and slides in from the left */
  #card.anchored{transform:translateX(-14px) scale(.97)}
  #card.anchored.show{transform:none}
  #cardArt{height:124px;position:relative;overflow:hidden;background:#0e1622}
  /* accent wash shown until the interior render is ready */
  #cardArt .ph{position:absolute;inset:0;transition:opacity .45s ease}
  #cardArt .ph::after{content:"";position:absolute;inset:0;
    background:linear-gradient(105deg,rgba(255,255,255,.16) 0 22%,transparent 22% 100%)}
  #cardImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;transform:scale(1.06);transition:opacity .5s ease,transform 1.1s cubic-bezier(.22,1,.36,1)}
  #cardArt.ready #cardImg{opacity:1;transform:scale(1)}
  #cardArt.ready .ph{opacity:0}
  #cardArt .scrim{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top,rgba(6,12,22,.62) 0%,rgba(6,12,22,.12) 42%,transparent 70%)}
  #cardArt .tag{position:absolute;left:16px;bottom:11px;font-size:10px;font-weight:700;letter-spacing:.11em;
    text-transform:uppercase;color:rgba(255,255,255,.94);text-shadow:0 1px 6px rgba(0,0,0,.5)}
  #cardArt .shot{position:absolute;right:14px;bottom:11px;display:flex;align-items:center;gap:5px;
    font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.8);
    text-shadow:0 1px 6px rgba(0,0,0,.5);opacity:0;transition:opacity .4s .2s}
  #cardArt.ready .shot{opacity:1}
  #cardArt .shot i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}
  #cardClose{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;
    background:rgba(0,0,0,.28);display:grid;place-items:center;backdrop-filter:blur(6px)}
  #cardClose svg{width:13px;height:13px;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round}
  #cardClose:hover{background:rgba(0,0,0,.45)}
  #cardBody{padding:16px 18px 18px}
  #cardTitle{font-size:19px;font-weight:700;letter-spacing:-.025em;color:var(--ink);line-height:1.2}
  #cardSub{font-size:12.5px;color:var(--muted);font-weight:550;margin-top:3px;letter-spacing:-.005em}
  #cardDesc{font-size:12.5px;line-height:1.55;color:#3c4a5e;margin-top:11px}
  #cardStats{display:flex;gap:0;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  #cardStats div{flex:1}
  #cardStats .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
  #cardStats .v{font-size:13px;font-weight:650;color:var(--ink);margin-top:2px;letter-spacing:-.01em}
  #launch{
    margin-top:16px;width:100%;height:44px;border-radius:11px;background:var(--ink);color:#fff;
    font-size:13.5px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:9px;
    transition:background .18s,transform .12s;
  }
  #launch:hover{background:var(--accent-deep)}
  #launch:active{transform:scale(.985)}
  #launch svg{width:15px;height:15px;fill:#fff}

  /* ---------- interior HUD ---------- */
  /* visibility (not just opacity) so hidden interior controls can't be clicked from the aerial view */
  #interiorUI{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;visibility:hidden;
    transition:opacity .5s,visibility 0s .5s}
  #interiorUI.show{opacity:1;visibility:visible;transition:opacity .5s,visibility 0s 0s}
  #intTop{position:absolute;top:18px;left:18px;padding:10px 18px;pointer-events:auto;display:flex;gap:12px;align-items:center}
  #intTop .back{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;color:var(--ink)}
  #intTop .back svg{width:14px;height:14px;stroke:var(--ink);stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
  #intTop .div{width:1px;height:16px;background:var(--line)}
  #intTop .name{font-size:12.5px;font-weight:600;color:var(--muted)}

  #intBar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);pointer-events:auto;
    display:flex;align-items:center;gap:4px;padding:7px 8px}
  #intBar .nav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
  #intBar .nav:hover{background:rgba(11,18,32,.07)}
  #intBar .nav svg{width:15px;height:15px;stroke:var(--ink);stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
  #stops{display:flex;gap:2px;padding:0 6px}
  .stop{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);
    letter-spacing:-.01em;white-space:nowrap;transition:.2s}
  .stop:hover{color:var(--ink);background:rgba(11,18,32,.05)}
  .stop.on{background:var(--ink);color:#fff}

  #intCaption{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);text-align:center;
    color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.55);pointer-events:none;transition:opacity .4s}
  #intCaption .t{font-size:23px;font-weight:700;letter-spacing:-.03em}
  #intCaption .s{font-size:12.5px;font-weight:550;opacity:.82;margin-top:2px;letter-spacing:.005em}

  /* ---------- transition veil ---------- */
  #veil{position:fixed;inset:0;z-index:60;background:#0a1017;opacity:0;pointer-events:none;transition:opacity .001s}
  #vignette{position:fixed;inset:0;z-index:10;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(6,12,22,.42) 100%)}

  /* ---------- loader ---------- */
  #loader{position:fixed;inset:0;z-index:80;background:#0a1017;display:grid;place-items:center;
    transition:opacity .6s;color:#8ea3bf;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  #loader.gone{opacity:0;pointer-events:none}

  @media (max-width:640px){
    #card{right:12px;left:12px;bottom:12px;width:auto}
    .poi .lbl{font-size:11px}
    #hint{display:none}
    #topLeft .s{display:none}
    #stops{max-width:52vw;overflow-x:auto}
  }
</style>
</head>
<body>

<div id="loader">Preparing campus…</div>
<div id="vignette"></div>
<div id="poiLayer"></div>

<div class="ui" id="topLeft">
  <button class="pill" id="brandBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="brandMenu">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 21V8l6-4 6 4v13M10 21v-5h4v5"/></svg></div>
    <div>
      <div class="t">CoStar Group Office</div>
      <div class="s">1400 Harbor Point Dr · Aerial Tour</div>
    </div>
    <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <div id="brandMenu" role="menu" aria-label="Points of interest"></div>
</div>

<div class="ui" id="topRight">
  <div class="pill" id="autoBadge"><span id="autoDot"></span><span id="autoText">Auto-orbit</span></div>
  <button class="pill iconbtn" id="resetBtn" title="Reset view">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4M3 4v5h5"/></svg>
  </button>
</div>

<div class="ui pill" id="hint">Drag to orbit · scroll to zoom · click a marker to explore</div>

<div id="card">
  <div id="cardArt">
    <div class="ph"></div>
    <img id="cardImg" alt="Interior preview" />
    <div class="scrim"></div>
    <div class="tag" id="cardTag">Point of interest</div>
    <div class="shot"><i></i> Interior preview</div>
    <button id="cardClose"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div id="cardBody">
    <div id="cardTitle">—</div>
    <div id="cardSub">—</div>
    <div id="cardDesc">—</div>
    <div id="cardStats"></div>
    <button id="launch">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span>Launch interior tour</span>
    </button>
  </div>
</div>

<div id="interiorUI">
  <div class="pill" id="intTop">
    <button class="back" id="exitBtn"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Back to aerial</button>
    <div class="div"></div>
    <div class="name" id="intName">Interior</div>
  </div>
  <div id="intCaption"><div class="t"></div><div class="s"></div></div>
  <div class="pill" id="intBar">
    <button class="nav" id="prevBtn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div id="stops"></div>
    <button class="nav" id="nextBtn"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</div>

<div id="veil"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================================
   COSTAR GROUP OFFICE — aerial tour prototype
   Custom camera rig (orbit + interior dolly), POI system, dual-scene tours.
   ========================================================================== */
(function(){
'use strict';

const IDLE_RESUME_MS = 10000;   // resume autoplay after 10s of no interaction

/* ---------------------------------------------------------------- renderer */
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(46, innerWidth/innerHeight, 0.5, 3000);

/* ------------------------------------------------------------------ scenes */
const exterior = new THREE.Scene();
exterior.fog = new THREE.Fog(0xcfe0f2, 320, 900);

const interior = new THREE.Scene();
interior.fog = new THREE.Fog(0xdfe7f0, 60, 220);

let activeScene = exterior;

/* --------------------------------------------------------------- materials */
const M = {
  glass:      new THREE.MeshStandardMaterial({color:0x8fb4d8, metalness:.85, roughness:.14}),
  glassDark:  new THREE.MeshStandardMaterial({color:0x4d6f92, metalness:.9,  roughness:.2}),
  spandrel:   new THREE.MeshStandardMaterial({color:0xf2f4f7, metalness:.1,  roughness:.62}),
  stone:      new THREE.MeshStandardMaterial({color:0xdcd8d0, metalness:0,   roughness:.85}),
  stoneDark:  new THREE.MeshStandardMaterial({color:0xb8b3aa, metalness:0,   roughness:.9}),
  concrete:   new THREE.MeshStandardMaterial({color:0xc3c6c9, metalness:0,   roughness:.95}),
  asphalt:    new THREE.MeshStandardMaterial({color:0x50555c, metalness:0,   roughness:1}),
  grass:      new THREE.MeshStandardMaterial({color:0x7fa25c, metalness:0,   roughness:1}),
  grassDark:  new THREE.MeshStandardMaterial({color:0x6b8d4c, metalness:0,   roughness:1}),
  paver:      new THREE.MeshStandardMaterial({color:0xd7cfc2, metalness:0,   roughness:.9}),
  water:      new THREE.MeshStandardMaterial({color:0x2f6f9e, metalness:.6,  roughness:.12}),
  trunk:      new THREE.MeshStandardMaterial({color:0x6b5545, metalness:0,   roughness:1}),
  leaf:       new THREE.MeshStandardMaterial({color:0x4f7f42, metalness:0,   roughness:.95, flatShading:true}),
  leafLight:  new THREE.MeshStandardMaterial({color:0x679a4e, metalness:0,   roughness:.95, flatShading:true}),
  metal:      new THREE.MeshStandardMaterial({color:0x9aa3ad, metalness:.8,  roughness:.35}),
  accent:     new THREE.MeshStandardMaterial({color:0x2f7df6, metalness:.2,  roughness:.5}),
  white:      new THREE.MeshStandardMaterial({color:0xffffff, metalness:0,   roughness:.55}),
  woodLight:  new THREE.MeshStandardMaterial({color:0xd9b98c, metalness:0,   roughness:.7}),
  woodDark:   new THREE.MeshStandardMaterial({color:0x8b6a45, metalness:0,   roughness:.75}),
  carpet:     new THREE.MeshStandardMaterial({color:0x40495a, metalness:0,   roughness:1}),
  fabric:     new THREE.MeshStandardMaterial({color:0x36506e, metalness:0,   roughness:.95}),
  fabric2:    new THREE.MeshStandardMaterial({color:0xb4623f, metalness:0,   roughness:.95}),
  terrazzo:   new THREE.MeshStandardMaterial({color:0xe9e6e0, metalness:.05, roughness:.32}),
  ceiling:    new THREE.MeshStandardMaterial({color:0xf7f7f5, metalness:0,   roughness:.9}),
  intGlass:   new THREE.MeshStandardMaterial({color:0xbcd6e8, metalness:.4, roughness:.06,
                 transparent:true, opacity:.24, side:THREE.DoubleSide}),
  emissive:   new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xfff2dc, emissiveIntensity:1.6, roughness:1}),
};

/* --------------------------------------------------------------------- sky */
function makeSky(){
  const g = new THREE.SphereGeometry(1400, 32, 20);
  const m = new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false,
    uniforms:{ top:{value:new THREE.Color(0x3f7fc4)}, mid:{value:new THREE.Color(0xa9cbe8)}, bot:{value:new THREE.Color(0xe8eef2)} },
    vertexShader:'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:`
      varying vec3 vP; uniform vec3 top,mid,bot;
      void main(){
        float h = normalize(vP).y;
        vec3 c = mix(bot, mid, smoothstep(-0.12, 0.28, h));
        c = mix(c, top, smoothstep(0.22, 0.95, h));
        gl_FragColor = vec4(c,1.);
      }`
  });
  return new THREE.Mesh(g,m);
}
exterior.add(makeSky());

/* ------------------------------------------------------------------ lights */
function lightRig(scene, sunPos, intensity, ambient, shadowSpan){
  const hemi = new THREE.HemisphereLight(0xdcecff, 0x6d6a5e, ambient);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff2df, intensity);
  sun.position.set(sunPos.x, sunPos.y, sunPos.z);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  const s = shadowSpan;
  sun.shadow.camera.left=-s; sun.shadow.camera.right=s;
  sun.shadow.camera.top=s;   sun.shadow.camera.bottom=-s;
  sun.shadow.camera.near=1;  sun.shadow.camera.far=s*4;
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.6;
  scene.add(sun); scene.add(sun.target);
  const fill = new THREE.DirectionalLight(0xbfd6f2, .28);
  fill.position.set(-sunPos.x, sunPos.y*.6, -sunPos.z);
  scene.add(fill);
  return sun;
}

/* --- Tower builder ------------------------------------------------------- */
function tower(cfg){
  const g = new THREE.Group(); g.position.set(cfg.x,0,cfg.z);
  if(cfg.rotY) g.rotation.y = cfg.rotY;
  site.add(g);
  const {w,d,floors} = cfg, fh = 4.2;

  // podium
  const pod = box(w+7, 6, d+7, M.stone, 0, 3, 0, g);
  occluders.push(pod);

  // shaft: glass core + spandrel bands per floor
  const shaft = new THREE.Mesh(new THREE.BoxGeometry(w, floors*fh, d), cfg.dark?M.glassDark:M.glass);
  shaft.position.y = 6 + floors*fh/2; shaft.castShadow=true; shaft.receiveShadow=true;
  g.add(shaft); occluders.push(shaft);

  for(let i=0;i<=floors;i++){
    const band = new THREE.Mesh(new THREE.BoxGeometry(w+.7, .85, d+.7), M.spandrel);
    band.position.y = 6 + i*fh; band.castShadow=true; band.receiveShadow=true; g.add(band);
  }
  // vertical mullion fins
  for(const sx of [-1,1]){
    for(let i=-2;i<=2;i++){
      const fin = new THREE.Mesh(new THREE.BoxGeometry(.5, floors*fh, .5), M.spandrel);
      fin.position.set(sx*(w/2+.2), 6+floors*fh/2, i*(d/5));
      fin.castShadow=true; g.add(fin);
    }
  }
  // crown
  box(w+2, 2.2, d+2, M.stoneDark, 0, 6+floors*fh+1.1, 0, g);
  const mech = box(w*.45, 5, d*.45, M.concrete, 0, 6+floors*fh+4.7, 0, g);
  occluders.push(mech);
  // roof antenna
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(.22,.35,14,8), M.metal);
  mast.position.set(w*.2, 6+floors*fh+14, -d*.2); mast.castShadow=true; g.add(mast);

  // entrance canopy on +Z face
  const can = box(cfg.canopyW||22, .7, 9, M.white, 0, 7.6, d/2+7, g);
  occluders.push(can);
  for(const sx of [-1,1]) {
    const col = new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,7.4,10), M.metal);
    col.position.set(sx*((cfg.canopyW||22)/2-1.6), 3.8, d/2+10.5); col.castShadow=true; g.add(col);
  }
  // lobby glass wall
  const lob = box((cfg.canopyW||22)-2, 5.4, .4, M.glassDark, 0, 3.2, d/2+3.6, g);
  occluders.push(lob);
  // entry steps + plaza
  slab((cfg.canopyW||22)+14, 22, M.paver, 0, .12, d/2+14, 0, g);
  box((cfg.canopyW||22)+4, .5, 3, M.stone, 0, .3, d/2+4.6, g);
  box((cfg.canopyW||22)+4, .5, 3, M.stone, 0, .6, d/2+3.0, g);

  return g;
}

/* ======================================================= INTERIOR STILLS
   Each info card shows a real render of the space its Launch button opens.
   Shot once at startup on a small offscreen renderer, one per idle beat so
   the aerial view never stutters, then the offscreen context is released. */
const previews = Object.create(null);
const PREV_W = 680, PREV_H = 256;

function makeShotRenderer(){
  try{
    const r = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
    r.setPixelRatio(1);
    r.setSize(PREV_W, PREV_H, false);
    r.outputEncoding = THREE.sRGBEncoding;
    r.toneMapping = THREE.ACESFilmicToneMapping;
    r.toneMappingExposure = 1.08;
    r.shadowMap.enabled = true;
    r.shadowMap.type = THREE.PCFSoftShadowMap;
    return r;
  } catch(err){ return null; }      // no second GL context available — cards fall back to the accent wash
}

function shootPreviews(){
  const shot = makeShotRenderer();
  if(!shot) return;
  const cam = new THREE.PerspectiveCamera(34, PREV_W/PREV_H, 0.4, 2000);
  const queue = POIS.slice();

  (function step(){
    if(!queue.length){                       // done — free the extra GL context
      clearInterior();
      shot.dispose();
      if(shot.forceContextLoss) shot.forceContextLoss();
      return;
    }
    // never touch interiorRoot while a tour is using it
    if(rig.mode !== 'aerial'){ setTimeout(step, 700); return; }

    const p = queue.shift();
    const cfg = INTERIORS[p.interior] || INTERIORS.lobby;
    const view = p.preview || cfg.hero || cfg.stops[0];
    try{
      clearInterior();
      cfg.build();
      cam.position.fromArray(view.pos);
      cam.lookAt(new THREE.Vector3().fromArray(view.look));
      shot.render(interior, cam);
      previews[p.id] = shot.domElement.toDataURL('image/jpeg', 0.86);
      paintMenuThumb(p);
      if(activePOI && activePOI.id === p.id) paintCardArt(p);   // card already open
    } catch(err){ /* skip this preview, keep the wash */ }
    clearInterior();
    setTimeout(step, 90);
  })();
}

/* ============================================================== CAMERA RIG */
const rig = {
  mode:'aerial',                       // 'aerial' | 'interior' | 'transition'
  // aerial orbit state
  target:new THREE.Vector3(-8, 6, 0),
  theta:Math.PI*0.62, phi:1.02, radius:210,
  gTarget:new THREE.Vector3(-8, 6, 0), gTheta:Math.PI*0.62, gPhi:1.02, gRadius:210,
  auto:true, idle:0,
  // interior state
  pos:new THREE.Vector3(), look:new THREE.Vector3(),
  gPos:new THREE.Vector3(), gLook:new THREE.Vector3(),
  yaw:0, pitch:0,                      // user free-look offsets in interior
};
const HOME = {target:new THREE.Vector3(-8,6,0), theta:Math.PI*0.62, phi:1.02, radius:210};

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function easeInOut(t){return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;}

/* The auto-orbit lets theta accumulate without bound, so a raw assignment can
   spin the camera many turns. Always take the equivalent angle nearest to it. */
function nearestAngle(cur, target){
  const TAU = Math.PI*2;
  let d = (target - cur) % TAU;
  if(d >  Math.PI) d -= TAU;
  if(d < -Math.PI) d += TAU;
  return cur + d;
}

/* Solve the orbit angle + distance that puts a POI's front elevation on screen.
   theta is derived from the facade normal; distance from the frame box and the
   camera's real FOV/aspect, so narrow windows automatically pull back. */
function computeFocus(p){
  const vfov = camera.fov * Math.PI/180;
  const hfov = 2*Math.atan(Math.tan(vfov/2) * camera.aspect);
  const rV = (p.frame.h*0.5) / Math.tan(vfov*0.5);
  const rH = (p.frame.w*0.5) / Math.tan(hfov*0.5);
  return {
    target: new THREE.Vector3(p.frame.x, p.frame.y, p.frame.z),
    theta:  Math.atan2(p.front[0], p.front[1]) + (p.yaw||0),   // stand on the facade's side
    phi:    p.phi || 1.15,
    radius: clamp(Math.max(rV, rH) * 1.28, 46, 320),
  };
}

function applyAerial(){
  const {target, theta, phi, radius} = rig;
  const sp = Math.sin(phi), cp = Math.cos(phi);
  camera.position.set(
    target.x + radius*sp*Math.sin(theta),
    target.y + radius*cp,
    target.z + radius*sp*Math.cos(theta)
  );
  camera.lookAt(target);
}

/* --------------------------------------------------------- input handling */
const dom = renderer.domElement;
let dragging=false, lastX=0, lastY=0, moved=0;

function nudge(){                       // any user interaction
  rig.idle = 0;
  if(rig.auto){ rig.auto=false; updateBadge(); }
}
function updateBadge(){
  const b = document.getElementById('autoBadge'), t = document.getElementById('autoText');
  if(rig.mode==='interior'){
    b.classList.toggle('paused', !rig.auto);
    t.textContent = rig.auto ? 'Auto-tour' : 'Resuming in ' + Math.ceil((IDLE_RESUME_MS-rig.idle)/1000) + 's';
    return;
  }
  b.classList.toggle('paused', !rig.auto);
  t.textContent = rig.auto ? 'Auto-orbit' : 'Resuming in ' + Math.ceil((IDLE_RESUME_MS-rig.idle)/1000) + 's';
}

dom.addEventListener('pointerdown', e=>{
  dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY;
  dom.setPointerCapture(e.pointerId); nudge();
});
dom.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY; moved += Math.abs(dx)+Math.abs(dy);
  nudge();
  if(rig.mode==='aerial'){
    rig.gTheta -= dx*0.0042;
    rig.gPhi    = clamp(rig.gPhi - dy*0.0032, 0.20, 1.40);
  } else if(rig.mode==='interior'){
    rig.yaw   = clamp(rig.yaw   - dx*0.0032, -0.75, 0.75);
    rig.pitch = clamp(rig.pitch - dy*0.0022, -0.30, 0.30);
  }
});
addEventListener('pointerup', ()=>{ dragging=false; });
dom.addEventListener('wheel', e=>{
  e.preventDefault(); nudge();
  if(rig.mode==='aerial') rig.gRadius = clamp(rig.gRadius * (1 + Math.sign(e.deltaY)*0.09), 70, 420);
}, {passive:false});
// a click on empty space (not a drag) dismisses the card and resumes the orbit
dom.addEventListener('click', ()=>{ if(moved < 6) closeCard({resume:true}); });

// pinch zoom (aerial)
let pinch=null;
dom.addEventListener('touchstart', e=>{ if(e.touches.length===2){
  pinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }});
dom.addEventListener('touchmove', e=>{ if(e.touches.length===2 && pinch){
  const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  nudge(); if(rig.mode==='aerial') rig.gRadius = clamp(rig.gRadius * (pinch/d), 70, 420); pinch=d; }}, {passive:true});
dom.addEventListener('touchend', ()=>{ pinch=null; });

addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(topLeft.classList.contains('open')) setMenu(false);
    else if(rig.mode==='interior') exitInterior();
    else closeCard({resume:true});
  }
  if(rig.mode==='interior'){
    if(e.key==='ArrowRight'){ nudge(); gotoStop(tour.i+1); }
    if(e.key==='ArrowLeft'){ nudge(); gotoStop(tour.i-1); }
  }
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(rig.mode==='interior'){ exitInterior(); return; }
  closeCard();
  rig.gTarget.copy(HOME.target); rig.gTheta=HOME.theta; rig.gPhi=HOME.phi; rig.gRadius=HOME.radius;
  rig.auto=true; rig.idle=0; updateBadge();
});

function paintCardArt(p){
  cardPh.style.background = `linear-gradient(135deg, ${p.accent[0]}, ${p.accent[1]})`;
  const url = previews[p.id];
  if(url){ cardImg.src = url; cardArt.classList.add('ready'); }
  else   { cardArt.classList.remove('ready'); cardImg.removeAttribute('src'); }
}
/* the dropdown reuses the same still as a thumbnail */
function paintMenuThumb(p){
  const url = previews[p.id];
  if(!url || !p.thumb) return;
  p.thumb.src = url;
  p.thumb.classList.add('ready');
}

/* The card normally lives in the bottom-right corner. Chosen from the dropdown,
   it docks to the right of the menu instead — but only when there's room for it,
   otherwise a narrow window would push it off-screen. */
function placeCard(anchor){
  const CARD_W = 330, GAP = 12;
  if(anchor){
    const b = brandBtn.getBoundingClientRect();
    const menuW = brandMenu.offsetWidth || 306;
    const left = b.left + menuW + GAP;
    if(left + CARD_W + GAP <= innerWidth){
      card.style.left = left + 'px';
      card.style.top  = (b.bottom + 8) + 'px';
      card.style.right = 'auto';
      card.style.bottom = 'auto';
      card.classList.add('anchored');
      return;
    }
  }
  card.classList.remove('anchored');
  card.style.left = card.style.top = card.style.right = card.style.bottom = '';
}

function selectPOI(p, opts){
  placeCard(opts && opts.anchor);
  activePOI = p;
  POIS.forEach(q=>q.el.classList.toggle('active', q===p));
  markMenu(p);
  document.getElementById('cardTitle').textContent = p.title;
  document.getElementById('cardSub').textContent   = p.sub;
  document.getElementById('cardDesc').textContent  = p.desc;
  document.getElementById('cardTag').textContent   = p.tag;
  paintCardArt(p);
  document.getElementById('cardStats').innerHTML =
    p.stats.map(([k,v])=>`<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  card.classList.add('show');

  // ease the orbit around to this POI's front elevation, and pause autoplay
  const f = computeFocus(p);
  p._focus = f;
  rig.gTarget.copy(f.target);
  rig.gTheta = nearestAngle(rig.gTheta, f.theta);   // shortest way round, never a full spin
  rig.gPhi   = f.phi;
  rig.gRadius= f.radius;
  rig.auto = false; rig.idle = 0; updateBadge();
}
/* Dismissing the card is a signal the user is done inspecting, so the orbit
   picks straight back up instead of waiting out the idle timer. */
function closeCard(opts){
  const wasOpen = !!activePOI;
  card.classList.remove('show');
  POIS.forEach(q=>{ q.el.classList.remove('active'); q.row.classList.remove('on'); });
  activePOI = null;
  if(wasOpen && opts && opts.resume && rig.mode === 'aerial'){
    rig.auto = true; rig.idle = 0; updateBadge();
  }
}
document.getElementById('cardClose').addEventListener('click', e=>{ e.stopPropagation(); closeCard({resume:true}); });
card.addEventListener('pointerdown', e=>e.stopPropagation());

/* ======================================================== TOUR TRANSITIONS */
const veil = document.getElementById('veil');
const intUI = document.getElementById('interiorUI');
const tour = { cfg:null, i:0, t:0, phase:'dwell', dwell:4.2, travel:3.2 };
let savedAerial = null;

function fade(to, ms){
  return new Promise(res=>{
    veil.style.transition = `opacity ${ms}ms ease`;
    requestAnimationFrame(()=>{ veil.style.opacity = to; setTimeout(res, ms); });
  });
}

document.getElementById('launch').addEventListener('click', async e=>{
  e.stopPropagation();
  if(!activePOI) return;
  enterInterior(activePOI);
});

async function enterInterior(poi){
  const cfg = INTERIORS[poi.interior] || INTERIORS.lobby;
  rig.mode = 'transition';
  card.classList.remove('show');
  poiLayer.style.opacity = 0;
  document.getElementById('hint').style.opacity = 0;
  setMenu(false);
  topLeft.classList.add('hide');

  // save aerial state to return to
  savedAerial = {target:rig.gTarget.clone(), theta:rig.gTheta, phi:rig.gPhi, radius:rig.gRadius};

  // 1) dive through the facade along its normal (reads as flying in the front door)
  const f = poi._focus || computeFocus(poi);
  const doorway = f.target.clone().add(
    new THREE.Vector3(poi.front[0], 0, poi.front[1]).normalize().multiplyScalar(-9));
  const from = {t:rig.target.clone(), th:rig.theta, ph:rig.phi, r:rig.radius};
  const to   = {t:doorway, th:nearestAngle(rig.theta, f.theta), ph:1.30, r:24};
  await animate(1400, k=>{
    const e2 = easeInOut(k);
    rig.target.lerpVectors(from.t, to.t, e2);
    rig.theta = lerp(from.th, to.th, e2);
    rig.phi   = lerp(from.ph, to.ph, e2);
    rig.radius= lerp(from.r,  to.r,  e2);
    applyAerial();
    veil.style.opacity = Math.max(0, (k-0.55)/0.45);
  });

  // 2) swap scene
  clearInterior();
  cfg.build();
  activeScene = interior;
  tour.cfg = cfg; tour.i = 0; tour.t = 0; tour.phase='dwell';
  rig.mode = 'interior';
  rig.auto = true; rig.idle = 0; rig.yaw = 0; rig.pitch = 0;
  const s0 = cfg.stops[0];
  rig.pos.fromArray(s0.pos);  rig.gPos.copy(rig.pos);
  rig.look.fromArray(s0.look);rig.gLook.copy(rig.look);
  applyInterior();
  buildStops(cfg);
  setCaption(s0);
  document.getElementById('intName').textContent = cfg.name;
  intUI.classList.add('show');
  updateBadge();

  await fade(0, 700);
}

async function exitInterior(){
  rig.mode = 'transition';
  intUI.classList.remove('show');
  await fade(1, 420);
  activeScene = exterior;
  clearInterior();
  tour.cfg = null;
  const a = savedAerial || HOME;
  rig.target.copy(a.target); rig.gTarget.copy(a.target);
  rig.theta = a.theta - 0.35; rig.gTheta = a.theta;
  rig.phi = 1.25; rig.gPhi = a.phi;
  rig.radius = 40; rig.gRadius = a.radius;
  applyAerial();
  rig.mode = 'aerial';
  rig.auto = false; rig.idle = 0; updateBadge();
  poiLayer.style.opacity = 1;
  document.getElementById('hint').style.opacity = 1;
  topLeft.classList.remove('hide');
  await fade(0, 620);
}
document.getElementById('exitBtn').addEventListener('click', e=>{ e.stopPropagation(); exitInterior(); });

function animate(ms, step){
  return new Promise(res=>{
    const t0 = performance.now();
    (function loop(){
      const k = Math.min(1, (performance.now()-t0)/ms);
      step(k);
      renderer.render(activeScene, camera);
      if(k<1) requestAnimationFrame(loop); else res();
    })();
  });
}

/* ------------------------------------------------------- interior tour UI */
function buildStops(cfg){
  const el = document.getElementById('stops');
  el.innerHTML = '';
  cfg.stops.forEach((s,i)=>{
    const b = document.createElement('button');
    b.className = 'stop' + (i===0?' on':'');
    b.textContent = s.label;
    b.addEventListener('click', ev=>{ ev.stopPropagation(); nudge(); gotoStop(i); });
    el.appendChild(b);
  });
}
function markStop(i){
  [...document.getElementById('stops').children].forEach((c,j)=>c.classList.toggle('on', j===i));
}
function setCaption(s){
  const c = document.getElementById('intCaption');
  c.style.opacity = 0;
  setTimeout(()=>{
    c.querySelector('.t').textContent = s.cap[0];
    c.querySelector('.s').textContent = s.cap[1];
    c.style.opacity = 1;
  }, 220);
}
function gotoStop(i){
  if(!tour.cfg) return;                      // guard: no active interior tour
  const n = tour.cfg.stops.length;
  tour.i = ((i % n) + n) % n;
  const s = tour.cfg.stops[tour.i];
  rig.gPos.fromArray(s.pos);
  rig.gLook.fromArray(s.look);
  rig.yaw = 0; rig.pitch = 0;
  tour.phase = 'travel'; tour.t = 0;
  markStop(tour.i);
  setCaption(s);
}
document.getElementById('prevBtn').addEventListener('click', e=>{ e.stopPropagation(); nudge(); gotoStop(tour.i-1); });
document.getElementById('nextBtn').addEventListener('click', e=>{ e.stopPropagation(); nudge(); gotoStop(tour.i+1); });
document.getElementById('intBar').addEventListener('pointerdown', e=>e.stopPropagation());
document.getElementById('intTop').addEventListener('pointerdown', e=>e.stopPropagation());

function applyInterior(){
  camera.position.copy(rig.pos);
  const dir = new THREE.Vector3().subVectors(rig.look, rig.pos);
  const len = dir.length();
  const sph = new THREE.Spherical().setFromVector3(dir);
  sph.theta += rig.yaw;
  sph.phi = clamp(sph.phi + rig.pitch, 0.25, Math.PI-0.25);
  sph.radius = len;
  const t = new THREE.Vector3().setFromSpherical(sph).add(rig.pos);
  camera.lookAt(t);
}

/* ================================================================ POI PINS */
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector3();
function updatePins(){
  if(rig.mode !== 'aerial'){ return; }
  const camPos = camera.position;
  for(const p of POIS){
    ndc.copy(p.pos).project(camera);
    const behind = ndc.z > 1;
    const x = (ndc.x*0.5+0.5)*innerWidth;
    const y = (-ndc.y*0.5+0.5)*innerHeight;
    const off = x<-40 || x>innerWidth+40 || y<-40 || y>innerHeight+40;
    p.el.classList.toggle('hidden', behind || off);
    if(behind || off) continue;
    p.el.style.left = x.toFixed(1)+'px';
    p.el.style.top  = y.toFixed(1)+'px';
    // occlusion test against buildings
    const dir = new THREE.Vector3().subVectors(p.pos, camPos);
    const dist = dir.length(); dir.normalize();
    ray.set(camPos, dir); ray.far = dist - 2;
    const hit = ray.intersectObjects(occluders, false);
    p.el.classList.toggle('occluded', hit.length>0);
  }
}

/* ==================================================================== LOOP */
const clock = new THREE.Clock();
let badgeTick = 0;

function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);

  if(rig.mode === 'aerial'){
    // idle → resume autoplay
    if(!rig.auto){
      rig.idle += dt*1000;
      if(rig.idle >= IDLE_RESUME_MS){ rig.auto = true; rig.idle = 0; closeCard(); updateBadge(); }
    }
    if(rig.auto){
      rig.gTheta += dt * 0.055;
      // slow drift back to the campus-wide framing
      rig.gTarget.lerp(HOME.target, dt*0.55);
      rig.gPhi    = lerp(rig.gPhi,    HOME.phi,    dt*0.5);
      rig.gRadius = lerp(rig.gRadius, HOME.radius, dt*0.5);
    }
    const k = 1 - Math.pow(0.0016, dt);         // frame-rate independent damping
    rig.theta  = lerp(rig.theta,  rig.gTheta,  k);
    rig.phi    = lerp(rig.phi,    rig.gPhi,    k);
    rig.radius = lerp(rig.radius, rig.gRadius, k);
    rig.target.lerp(rig.gTarget, k);
    applyAerial();
    updatePins();
  }
  else if(rig.mode === 'interior'){
    if(!rig.auto){
      rig.idle += dt*1000;
      if(rig.idle >= IDLE_RESUME_MS){ rig.auto = true; rig.idle = 0; updateBadge(); }
    }
    if(rig.auto){
      tour.t += dt;
      if(tour.phase === 'dwell'){
        // gentle push-in while dwelling
        const s = tour.cfg.stops[tour.i];
        const fwd = new THREE.Vector3().fromArray(s.look).sub(new THREE.Vector3().fromArray(s.pos)).normalize();
        rig.gPos.fromArray(s.pos).addScaledVector(fwd, Math.min(tour.t,tour.dwell)*0.55);
        if(tour.t >= tour.dwell) gotoStop(tour.i+1);
      } else {
        if(tour.t >= tour.travel){ tour.phase='dwell'; tour.t=0; }
      }
    }
    const k = 1 - Math.pow(0.05, dt);
    rig.pos.lerp(rig.gPos, k);
    rig.look.lerp(rig.gLook, k);
    // decay user free-look back to the scripted framing once autoplay resumes
    if(rig.auto){ rig.yaw = lerp(rig.yaw,0,dt*1.4); rig.pitch = lerp(rig.pitch,0,dt*1.4); }
    applyInterior();
  }

  // badge countdown text, ~4x/sec
  badgeTick += dt;
  if(badgeTick > 0.25){ badgeTick = 0; if(!rig.auto && rig.mode!=='transition') updateBadge(); }

  renderer.render(activeScene, camera);
}

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  // keep the focused POI correctly framed when the aspect ratio changes
  if(activePOI && rig.mode==='aerial'){
    const f = computeFocus(activePOI);
    activePOI._focus = f;
    rig.gRadius = f.radius;
  }
  // and keep a menu-docked card docked (or drop it back to the corner if it no longer fits)
  if(card.classList.contains('anchored')) placeCard(true);
});

/* --------------------------------------------------------------- kick off */
applyAerial();
renderer.compile(exterior, camera);
frame();
setTimeout(()=>{
  document.getElementById('loader').classList.add('gone');
  setTimeout(()=>document.getElementById('hint').style.opacity=.001, 9000);
  setTimeout(shootPreviews, 400);          // render the info-card stills once the view is live
}, 500);
updateBadge();

})();
</script>
</body>
